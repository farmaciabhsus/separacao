<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Faltas de Medicamentos</title>
<style>
/* Design tokens herdados do sistema de Gestão de Almoxarifado (index.html) */
:root{
  --sage:#AECB6B; --sage-dark:#4FA98A; --sage-deep:#2F6E5C;
  --ink:#2B3324; --ink-soft:#5A6350; --white:#fff; --surface:#F6F7F2; --surface-2:#EEF1E6;
  --border:#DCE3CC; --border-soft:#E7ECDC;
  --amber:#B9852E; --amber-bg:#FBF3E3; --red:#B3261E; --red-bg:#FBEAE7; --blue:#3E7CA6; --blue-bg:#E7F0F6;
  --green-bg:#E6F2E9;
  --radius-lg:16px; --radius-md:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(43,51,36,.04),0 8px 24px rgba(43,51,36,.06);
  --serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,ui-serif,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);line-height:1.45;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.top{background:linear-gradient(155deg,var(--sage) 0%,var(--sage-dark) 100%);color:#fff}
.top-inner{max-width:1180px;margin:0 auto;padding:22px 24px 0;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.mark{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:18px}
h1.title{font-family:var(--serif);font-size:clamp(20px,2.6vw,28px);line-height:1.15;letter-spacing:-.01em}
.subtitle{margin:3px 0 0;font-size:13px;color:rgba(255,255,255,.92)}
.top-meta{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tabs{max-width:1180px;margin:16px auto 0;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tab-btn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px 10px 0 0;padding:10px 18px;font-weight:650;font-size:14px;cursor:pointer;white-space:nowrap}
.tab-btn:hover{background:rgba(255,255,255,.26)}
.tab-btn[aria-selected="true"]{background:var(--surface);color:var(--sage-deep)}
.tab-btn .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--sage-deep);color:#fff;font-size:11.5px;text-align:center}
.tab-btn[aria-selected="true"] .n{background:var(--sage-dark)}
main{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--white);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{font-family:var(--serif);font-size:19px;margin-bottom:4px}
.card .lead{margin:0 0 14px;color:var(--ink-soft);font-size:13.5px;max-width:78ch}
.card h3{font-size:14px;margin:16px 0 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:150px}
.field.grow{flex:1;min-width:240px}
.field label{font-size:12.5px;font-weight:650;color:var(--ink-soft)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{border:1.5px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:8px 10px;min-height:38px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(79,169,138,.35);outline-offset:1px;border-color:var(--sage-dark)}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--sage-dark);color:#fff;min-height:38px}
.btn:hover{background:var(--sage-deep)}
.btn:disabled{background:#B9C4B0;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--sage-deep);border:1.5px solid var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8f1e18}
.btn.sm{padding:5px 12px;font-size:12.5px;min-height:30px}
.btn.link{background:none;color:var(--sage-deep);padding:2px 4px;min-height:0;text-decoration:underline;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:14px 18px}
.kpi .v{font-family:var(--serif);font-size:32px;line-height:1.05;color:var(--sage-deep)}
.kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.kpi.warn .v{color:var(--amber)}
.kpi button{all:unset;cursor:pointer;color:var(--sage-deep);font-size:12.5px;text-decoration:underline;margin-top:4px;display:block}
.tbl-wrap{overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius-md);max-height:560px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px 10px;font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
table.t th.sortable{cursor:pointer}
table.t td{padding:6px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
table.t tr:hover td{background:#FAFBF6}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.name{min-width:280px}
table.t select{min-height:30px;padding:3px 6px;font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.b-amber{background:var(--amber-bg);color:var(--amber)}.b-red{background:var(--red-bg);color:var(--red)}
.b-green{background:var(--green-bg);color:var(--sage-deep)}.b-blue{background:var(--blue-bg);color:var(--blue)}.b-gray{background:var(--surface-2);color:var(--ink-soft)}
.sel-warn{border-color:var(--amber)!important;background:var(--amber-bg)}
.muted{color:var(--ink-soft)}.small{font-size:12.5px}
.alias{display:block;font-size:11.5px;color:var(--ink-soft)}
.msg{border-radius:var(--radius-md);padding:10px 14px;margin:10px 0;font-size:13.5px}
.msg.warn{background:var(--amber-bg);border:1px solid #E9D3A5}.msg.err{background:var(--red-bg);border:1px solid #F0C4BE;color:#7a1a14}
.msg.ok{background:var(--green-bg);border:1px solid #BFDDC7}.msg.info{background:var(--blue-bg);border:1px solid #BCD6E6}
.empty{padding:34px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px}
.drop{border:2px dashed var(--border);border-radius:var(--radius-md);padding:16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface)}
.drop.over{border-color:var(--sage-dark);background:var(--green-bg)}
.verdict{border-radius:var(--radius-lg);padding:18px 22px;margin:14px 0}
.verdict h3{font-family:var(--serif);font-size:24px;margin:0 0 4px}
.verdict.ok{background:var(--green-bg);border:1.5px solid var(--sage-dark)}.verdict.bad{background:var(--red-bg);border:1.5px solid var(--red)}
.verdict.ok h3{color:var(--sage-deep)}.verdict.bad h3{color:var(--red)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.calc div{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:10px 14px}
.calc b{display:block;font-family:var(--serif);font-size:26px}
.calc span{font-size:12.5px;color:var(--ink-soft)}
.logline{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--border-soft);font-size:13px}
.logline:first-child{border-top:0}.logline time{color:var(--ink-soft);white-space:nowrap;min-width:118px}
.modal-back{position:fixed;inset:0;background:rgba(43,51,36,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:100;overflow:auto}
.modal-back.on{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:92vh}
.modal.narrow{width:min(520px,100%)}
.modal header{padding:16px 22px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal header h2{font-family:var(--serif);font-size:20px}
.modal .body{padding:16px 22px;overflow:auto;flex:1}
.modal footer{padding:14px 22px;border-top:1px solid var(--border-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.modal footer .spacer{flex:1;color:var(--ink-soft);font-size:13px}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-soft)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:92vw}
#toast.on{opacity:1}
details{margin-top:10px}summary{cursor:pointer;font-weight:650;color:var(--sage-deep)}
.imgchart{max-width:100%;height:auto;border:1px solid var(--border-soft);border-radius:var(--radius-md);margin-top:10px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sec-title{font-family:var(--serif);font-size:17px;margin:22px 0 8px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--sage-dark)}
.pick-wrap{position:relative}
.pick-pop{position:absolute;z-index:60;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);max-height:300px;overflow:auto}
.pick-pop .pi{padding:8px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--border-soft)}
.pick-pop .pi:last-child{border-bottom:0}
.pick-pop .pi:hover,.pick-pop .pi.hl{background:var(--surface-2)}
.pick-pop .pi b{color:var(--sage-deep)}
.pick-pop .pi .alias{display:block;font-size:11.5px;color:var(--ink-soft)}
.pick-pop .cnt{padding:7px 12px;font-size:11.5px;color:var(--ink-soft);background:var(--surface);border-top:1px solid var(--border-soft)}
.pick-pop .none{padding:16px 12px;text-align:center;color:var(--ink-soft);font-size:13px}
/* ---------- modelo "Itens: seleção e dados de programação" do sistema original, adaptado ao cadastro de medicamentos ---------- */
.card-head{margin:-20px -22px 18px;padding:22px 22px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,var(--surface) 0%,rgba(246,247,242,0) 100%);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.card-head-main{display:flex;align-items:flex-start;gap:14px}
.step-badge{flex-shrink:0;width:32px;height:32px;border-radius:10px;background:linear-gradient(155deg,var(--sage) 0%,var(--sage-dark) 100%);color:#fff;font-family:var(--serif);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(47,110,92,.28)}
.card-head .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sage-deep)}
.card-head h2{font-family:var(--serif);font-size:19.5px;font-weight:700;letter-spacing:-.01em;margin:3px 0 0;color:var(--ink)}
.card-head p.desc{margin:8px 0 0;font-size:13.5px;color:var(--ink-soft);max-width:660px;line-height:1.6}
.suggested-badge{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--blue);padding:2px 6px 2px 5px;border-radius:999px;white-space:nowrap;cursor:help;margin-top:4px}
.search-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search-bar input[type=search]{height:38px;font-family:var(--sans);font-size:13px;padding:0 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--white);color:var(--ink);flex:1 1 240px;min-width:200px}
.kbd-hint{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--white);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;cursor:help;user-select:none}
.view-toggle{display:inline-flex;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.view-toggle-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;font-weight:700;background:var(--white);color:var(--ink-soft);border:none;border-radius:0;cursor:pointer}
.view-toggle-btn svg{width:14px;height:14px}
.view-toggle-btn.active-view{background:var(--sage-dark);color:#fff}
.view-toggle-btn:first-child{border-right:1.5px solid var(--border)}
.med-card{border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.med-card .mc-top{display:flex;gap:10px;align-items:flex-start}
.med-card .mc-name{font-weight:650;flex:1}
.med-card .mc-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-soft)}
.med-card .mc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.bulk-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);margin-bottom:12px}
.hidden{display:none!important}
.quicknav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.quicknav button{background:var(--white);border:1.5px solid var(--border);color:var(--sage-deep);font-weight:650;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer}
.quicknav button:hover{background:var(--surface-2);border-color:var(--sage-dark)}
table.t tr.off td{opacity:.45}
table.t tr.sel td{background:var(--green-bg)}
details>summary+*{margin-top:8px}
.field textarea{border:1.5px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:8px 10px;font-family:inherit}
/* ---------- Rotina do dia: edição direta, sem botão Editar ---------- */
.status-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.st{display:inline-flex;align-items:baseline;gap:7px;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:8px 14px;font-size:13px;color:var(--ink-soft);cursor:pointer;text-align:left}
.st b{font-family:var(--serif);font-size:21px;line-height:1;color:var(--sage-deep)}
.st:hover{border-color:var(--sage-dark)}
.st.warn{border-color:#E9D3A5;background:var(--amber-bg)}.st.warn b{color:var(--amber)}
.st.on{border-color:var(--sage-dark);box-shadow:inset 0 0 0 1px var(--sage-dark)}
.st.info{cursor:default}.st.info:hover{border-color:var(--border)}.st.info b{font-size:15px}
table.grade td{padding:4px 8px}
table.grade input[type=date]{min-height:30px;padding:3px 6px;font-size:12.5px;width:auto;min-width:132px}
table.grade select{min-width:200px;max-width:260px}
.pick-pop:empty{display:none}
@media (max-width:720px){.export-bar{bottom:6px;padding:10px 12px;gap:10px 18px}}
.mot{display:flex;gap:4px;align-items:center}
.okbtn{border:1.5px solid var(--amber);background:#fff;color:var(--amber);border-radius:6px;width:30px;height:30px;cursor:pointer;font-weight:800;flex-shrink:0}
.okbtn:hover{background:var(--amber);color:#fff}
table.t tr.enc td{background:#F7F8F3;color:var(--ink-soft)}
table.t tr.recent td{background:var(--green-bg)}
table.t tr.flash td{animation:rowflash 1.1s ease-out}
@keyframes rowflash{from{background:#C9E6D2}}
input.err,select.err{border-color:var(--red)!important;background:var(--red-bg)!important}
input.saved{border-color:var(--sage-dark)!important;background:var(--green-bg)!important}
.grade-note{margin:8px 0 0}
.export-bar{position:sticky;bottom:10px;z-index:5;background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px 30px;align-items:center;box-shadow:0 10px 30px rgba(43,51,36,.28);margin-top:6px}
.xb-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xb-t{display:flex;flex-direction:column;margin-right:6px;font-size:12.5px;color:rgba(255,255,255,.72)}
.xb-t b{color:#fff;font-size:13.5px}
.export-bar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.export-bar .btn.ghost:hover{background:rgba(255,255,255,.12)}
.export-bar .btn.link{color:#D5E7A8;padding:0 2px}
.export-bar select{min-height:26px;padding:1px 6px;width:auto;display:inline-block;color:var(--ink)}
.conf-inline{border:2px solid var(--sage-dark)}
.conf-inline>h2{margin-bottom:10px}
.conf-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border-soft);margin:16px -22px -20px;padding:12px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;border-radius:0 0 var(--radius-lg) var(--radius-lg);z-index:4}
.conf-foot .spacer{flex:1;color:var(--ink-soft);font-size:13px}
input.inl{min-height:32px!important;padding:4px 8px!important;font-size:13px}
input.inl.al{margin-top:4px;font-size:12px;color:var(--ink-soft)}
.medb{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){main{padding:16px 12px 50px}.top-inner{padding:16px 14px 0}.tabs{padding:0 12px}.card{padding:16px}.kpis,.calc{grid-template-columns:1fr 1fr}.tbl-wrap{max-height:70vh!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark" aria-hidden="true">Rx</div>
      <div>
        <h1 class="title">Controle de faltas de medicamentos</h1>
        <p class="subtitle">Atualize, confira e exporte numa tela só — tudo é salvo automaticamente</p>
      </div>
    </div>
    <div class="top-meta"><span class="chip" id="chipHoje"></span><span class="chip" id="chipSave"></span></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Seções do sistema">
    <button class="tab-btn" role="tab" data-tab="rotina" id="tb-rotina">Rotina do dia<span class="n" id="nFaltas">0</span></button>
    <button class="tab-btn" role="tab" data-tab="consulta" id="tb-consulta">Consulta de paciente</button>
    <button class="tab-btn" role="tab" data-tab="import" id="tb-import">Importações</button>
    <button class="tab-btn" role="tab" data-tab="param" id="tb-param">Parametrização</button>
  </nav>
</header>
<main>
  <section id="tab-rotina" class="tab" role="tabpanel"></section>
  <section id="tab-consulta" class="tab" role="tabpanel"></section>
  <section id="tab-import" class="tab" role="tabpanel"></section>
  <section id="tab-param" class="tab" role="tabpanel"></section>
  <div class="export-bar hidden" id="rtExport" aria-label="Exportações"></div>
</main>
<div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" style="display:none">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* =====================================================================
   NÚCLEO — constantes, datas, normalização de nomes, estado
   ===================================================================== */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABR = ['Jan','Fev','Mar','Abr','Maio','Jun','Jul','Ago','Set','Out','Nov','Dez']; // "Maio" igual ao arquivo original
const MOTIVOS = [
  {nome:'Motivos Diversos',                    col:'md', cab:'Falta no Almox  por Motivos Diversos'},
  {nome:'Sem Estoque Estadual',                col:'ee', cab:'Falta Estoque Estadual'},

  {nome:'Recolhimento pelo Fabricante',        col:'rf', cab:'Recolhimento pelo Fabricante'}
];
const MOTIVO_SUSP = MOTIVOS[2].nome;
const DENOM_PADRAO = 180;
const KEY = 'controleFaltas.v1', KEYPREV = 'controleFaltas.v1.anterior';

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const plural = (n,s,p) => n===1 ? s : (p||s+'s');

/* ---------- datas (ISO 'AAAA-MM-DD', aritmética em UTC: sem surpresas de fuso/horário de verão) ---------- */
const isoOf   = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const dnum    = iso => { const [y,m,d]=iso.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const dfrom   = n => { const t=new Date(n*864e5); return isoOf(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()); };
const addDays = (iso,n) => dfrom(dnum(iso)+n);
const diffDays= (a,b) => dnum(b)-dnum(a);
const fmtBR   = iso => iso ? iso.split('-').reverse().join('/') : '—';
const daysInMonth = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const validISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') && dfrom(dnum(s))===s;
function hoje(){
  if(S && S.param && validISO(S.param.hoje)) return S.param.hoje;
  const t=new Date(); return isoOf(t.getFullYear(),t.getMonth()+1,t.getDate());
}
function agoraBR(){ const t=new Date(); return `${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())}`; }
function parseDataQualquer(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return isoOf(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number' && v>20000 && v<80000){
    const p = XLSX.SSF.parse_date_code(v); return p ? isoOf(p.y,p.m,p.d) : null;
  }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return validISO(m[0])?m[0]:null;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){
    let y=+m[3]; if(y<100) y+=2000; const iso=isoOf(y,+m[2],+m[1]); return validISO(iso)?iso:null;
  }
  return null;
}

/* ---------- nomes ---------- */
const decodeEnt = s => String(s).replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi,(m,h)=>String.fromCharCode(parseInt(h,16)))
  .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&nbsp;/g,' ');
const norm = s => decodeEnt(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const cmpNome = (a,b) => norm(a.nome).localeCompare(norm(b.nome),'pt-BR');
const TOKC=new Map();
function tokens(s){ const k=String(s??''); let t=TOKC.get(k); if(!t){ t=norm(k).replace(/[()+,;\/-]/g,' ').replace(/(\d)([A-Z])/g,'$1 $2').replace(/([A-Z])(\d)/g,'$1 $2').replace(/\s+/g,' ').trim().split(' ').filter(Boolean); TOKC.set(k,t); } return t; }
function similaridade(a,b){
  const A=tokens(a), B=tokens(b);
  const nA=new Set(A.filter(t=>/\d/.test(t))), nB=new Set(B.filter(t=>/\d/.test(t)));
  if(nA.size!==nB.size || [...nA].some(t=>!nB.has(t))) return 0;   // dosagens precisam ser idênticas
  const sA=new Set(A), sB=new Set(B); let i=0;   // abreviações contam: CAPS ≈ CAPSULA, COMP ≈ COMPRIMIDO
  sA.forEach(t=>{ if(sB.has(t) || (t.length>=3 && !/\d/.test(t) && [...sB].some(u=>u.length>=3 && (u.startsWith(t)||t.startsWith(u))))) i++; });
  return i/(sA.size+sB.size-i);
}

/* ---------- estado ---------- */
function novoEstado(){
  const t=new Date();
  return {v:1, ano:t.getFullYear(), seq:1, meds:[], eps:[], cobertura:null, ultimoDia:null,
          indImp:{}, param:{tolerancia:180, denom:{}, hoje:''}, log:[], csv:null, historicoOk:false};
}
function migrar(o){
  const b=novoEstado(); const s=Object.assign(b,o);
  s.param=Object.assign(b.param,o.param||{}); s.param.denom=s.param.denom||{};
  s.indImp={}; s.param.hoje=''; s.log=s.log||[]; return s;   /* indicador sempre calculado; data manual não sobrevive ao recarregar */
}
let storageOk = true;

  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); if(o&&o.v===1) return migrar(o); } }
  catch(e){ storageOk=false; }
  return novoEstado();
}
let S = carregar();

  try{ const o=JSON.parse(localStorage.getItem(KEYPREV)); if(!o) return; const atual=S; S=migrar(o.estado); localStorage.removeItem(KEYPREV); commit(); toast('Última importação desfeita ('+o.ts+')'); }
  catch(e){ toast('Não foi possível desfazer.'); }
}
const nid = p => p + (S.seq++);
function logar(tipo,arquivo,resumo){ S.log.unshift({ts:agoraBR(),tipo,arquivo:arquivo||'',resumo:resumo||''}); S.log=S.log.slice(0,40); }

/* ---------- índices ---------- */
let IDX = {key:new Map(), med:new Map(), eps:new Map()};
function reindex(){
  IDX.key=new Map(); IDX.med=new Map(); IDX.eps=new Map();
  S.meds.forEach(m=>{
    IDX.med.set(m.id,m); IDX.key.set(norm(m.nome),m.id);
    (m.alias||[]).forEach(a=>{ const k=norm(a); if(!IDX.key.has(k)) IDX.key.set(k,m.id); });
  });
  S.eps.forEach(e=>{ if(!IDX.eps.has(e.med)) IDX.eps.set(e.med,[]); IDX.eps.get(e.med).push(e); });
  IDX.eps.forEach(l=>l.sort((a,b)=>a.ini<b.ini?-1:1));
}
const medDe = e => IDX.med.get(e.med);
const epAberto = medId => (IDX.eps.get(medId)||[]).find(e=>!e.fim);
const achaMed = nome => IDX.key.get(norm(nome));
function sobrepoe(medId,ini,fim,ignorar){
  return (IDX.eps.get(medId)||[]).find(e=> e.id!==ignorar && !((e.fim && e.fim<ini) || (fim && fim<e.ini)));
}
/* Medicamentos do cadastro mais parecidos com m (para "outros nomes" e "Unir a outro") */
function parecidosCom(m,n=5,min=0.3){
  const out=[];
  S.meds.forEach(x=>{ if(x.id===m.id) return;
    let best=0; [m.nome,...(m.alias||[])].forEach(a=>{ best=Math.max(best,similaridade(a,x.nome)); (x.alias||[]).forEach(b=>{ best=Math.max(best,similaridade(a,b)); }); });
    if(best>=min) out.push({med:x,score:best}); });
  return out.sort((a,b)=>b.score-a.score||cmpNome(a.med,b.med)).slice(0,n);
}
function sugerir(nome,n=3){
  const out=[];
  S.meds.forEach(m=>{
    let best=similaridade(nome,m.nome); (m.alias||[]).forEach(a=>{ best=Math.max(best,similaridade(nome,a)); });
    if(best>=0.55) out.push({med:m,score:best});
  });
  return out.sort((x,y)=>y.score-x.score).slice(0,n);
}
function commit(){ reindex(); salvar(); renderAll(); }

/* ---------- consultas ---------- */
const emFaltaHoje = () => S.eps.filter(e=>!e.fim);
function diasEmFalta(e, ref){ return diffDays(e.ini, e.fim || (ref||hoje())) + (e.fim?1:0); }

/* Dias marcados por medicamento/mês (mesma lógica do arquivo Consolidado: dia marcado = medicamento em falta naquele dia).
   Falta em aberto vale até hoje (inclusive). */
function diasPorMed(ano){
  const H=hoje(), a0=`${ano}-01-01`, a1=`${ano}-12-31`, res=new Map();
  S.eps.forEach(e=>{
    const ini = e.ini>a0?e.ini:a0; let fim = e.fim || H; if(fim>a1) fim=a1; if(!e.fim && H<a0) return;
    if(ini>fim) return;
    if(!res.has(e.med)) res.set(e.med, Array.from({length:12},()=>new Set()));
    const arr=res.get(e.med);
    for(let n=dnum(ini); n<=dnum(fim); n++){ const iso=dfrom(n); arr[+iso.slice(5,7)-1].add(+iso.slice(8,10)); }
  });
  return res;
}
/* Denominador do indicador (total de itens monitorados no mês), com preenchimento automático:
   usa o valor do mês se foi informado em Parametrização;
   senão repete o último valor informado em um mês anterior do mesmo ano; sem nenhum, usa o padrão. */
function denomEfetivo(mes){
  if(S.param.denom[mes]) return {val:+S.param.denom[mes], origem:'definido'};
  for(let m=mes-1;m>=1;m--){ if(S.param.denom[m]) return {val:+S.param.denom[m], origem:'herdado',de:m}; }
  return {val:DENOM_PADRAO, origem:'padrao'};
}
/* Contagem diária por motivo (para o Indicador) — sempre calculada a partir das faltas registradas. */
function indicadorMes(ano, mi){
  const H=hoje(), nd=daysInMonth(ano,mi+1), {val:denom}=denomEfetivo(mi+1), rows=[];
  const cont={}; for(let d=1; d<=nd; d++) cont[d]={md:0,ee:0,ds:0,rf:0};
  const m0=isoOf(ano,mi+1,1), m1=isoOf(ano,mi+1,nd);
  S.eps.forEach(e=>{
    const ini=e.ini>m0?e.ini:m0; let fim=e.fim||H; if(fim>m1) fim=m1; if(ini>fim) return;
    const col=(MOTIVOS.find(x=>x.nome===e.motivo)||MOTIVOS[0]).col;
    for(let n=dnum(ini); n<=dnum(fim); n++){ cont[+dfrom(n).slice(8,10)][col]++; }
  });
  for(let d=1; d<=nd; d++){
    const iso=isoOf(ano,mi+1,d), imp=null;
    if(!imp && iso>H){ rows.push({dia:d,iso,vazio:true}); continue; }
    const v = imp ? {md:imp.md||0,ee:imp.ee||0,ds:imp.ds||0,rf:imp.rf||0} : cont[d];
    const n=v.md+v.ee;
    rows.push({dia:d,iso,md:v.md,ee:v.ee,ds:v.ds,rf:v.rf,n,pct:n*100/denom,origem:imp?'importado':'calculado'});
  }
  return {rows,denom};
}

/* ---------- consulta de paciente ---------- */
function calcularConsulta(medId, prev, comp){
  const H=hoje(), atraso=diffDays(prev,comp), jFim=addDays(comp,-1);
  const partes=[]; let total=0;
  (IDX.eps.get(medId)||[]).forEach(e=>{
    const a = e.ini>prev?e.ini:prev;
    const lim = e.fim || (jFim<=H ? jFim : H);
    const b = lim<jFim?lim:jFim;
    if(a<=b){ const n=diffDays(a,b)+1; total+=n; partes.push({ep:e,de:a,ate:b,dias:n}); }
  });
  const tol = +S.param.tolerancia||0;
  const naoCoberto = Math.max(atraso-total,0);
  const perdeu = atraso>0 && naoCoberto>tol;
  return {atraso,total,naoCoberto,perdeu,partes,tol};
}

function libXLSX(){ if(typeof XLSX==='undefined') throw new Error('A biblioteca de leitura de planilhas não carregou. Verifique a conexão com a internet e recarregue a página.'); }

/* =====================================================================
   IMPORTAÇÃO 1 — Histórico "Med_em_falta_Consolidado"
   ===================================================================== */
async function iniciarHistorico(file){
  toast('Lendo o histórico…');
  const wb=lerWB(await file.arrayBuffer());
  const anoNome=(file.name.match(/20\d\d/)||[])[0];
  PLAN={tipo:'hist',arquivo:file.name,wb,ano:anoNome?+anoNome:S.ano};
  analisarHist(PLAN);
  if(!PLAN.meses.length){ PLAN=null; return modalMsg('Formato não reconhecido','<p>Não encontrei abas com nome de mês (Janeiro, Fevereiro…). Este importador espera o arquivo <b>Med_em_falta_Consolidado</b>.</p>'); }
  abrirModal(renderHist);
}
function analisarHist(P){
  const pres=new Map(), meses=[], avisos=[];
  MESES.forEach((mes,mi)=>{
    const sn=P.wb.SheetNames.find(n=>norm(n)===norm(mes)); if(!sn) return;
    const rows=sheetRows(P.wb.Sheets[sn],34,420); if(!rows.length) return;
    const it=rows[0].findIndex(h=>norm(h)==='TOTAL'); const nd=daysInMonth(P.ano,mi+1);
    const maxDia=it>0?Math.min(nd,it-1):nd; let nl=0, ignor=0;
    for(let r=1;r<rows.length;r++){
      const raw=rows[r][0]; if(typeof raw!=='string') continue; const nome=raw.trim(); if(!nome) continue;
      if(norm(nome).startsWith('LEGENDA')||nome.length>250){ ignor++; continue; }
      const k=norm(nome); let p=pres.get(k);
      if(!p){ p={k,nome,meses:new Set(),dias:Array.from({length:12},()=>new Set())}; pres.set(k,p); }
      if(p.meses.has(mi)) avisos.push(`"${nome}" aparece duas vezes em ${mes} (dias somados).`);
      p.meses.add(mi); nl++;
      for(let d=1;d<=maxDia;d++){ const v=rows[r][d]; if(v===1||v==='1'||v===true) p.dias[mi].add(d); }
    }
    meses.push({mi,nome:mes,linhas:nl,ignor});
  });
  P.pres=pres; P.meses=meses; P.avisos=avisos;
  const arr=[...pres.values()], sug=[];
  for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
    const a=arr[i], b=arr[j];
    if([...a.meses].some(m=>b.meses.has(m))) continue;   // presentes no mesmo mês = itens diferentes
    const s=similaridade(a.nome,b.nome); if(s>=0.6) sug.push({a:a.k,b:b.k,score:s});
  }
  P.sug=sug.sort((x,y)=>y.score-x.score); P.fusaoSel=new Set(P.sug.map((s,i)=>i));
}
function construirHist(P){
  const ano=P.ano, rep=new Map(); const find=k=>{ while(rep.has(k)) k=rep.get(k); return k; };
  P.sug.forEach((s,i)=>{
    if(!P.fusaoSel.has(i)) return; const A=find(s.a), B=find(s.b); if(A===B) return;
    const keep=P.pres.get(A).meses.size>=P.pres.get(B).meses.size?A:B; rep.set(keep===A?B:A,keep);
  });
  const grupos=new Map();
  P.pres.forEach((p,k)=>{
    const c=find(k); let g=grupos.get(c);
    if(!g){ g={nome:P.pres.get(c).nome,alias:[],dias:Array.from({length:12},()=>new Set())}; grupos.set(c,g); }
    if(k!==c) g.alias.push(p.nome);
    p.dias.forEach((set,mi)=>set.forEach(d=>g.dias[mi].add(d)));
  });
  let ultimo=null;
  grupos.forEach(g=>{
    g.ds=[]; g.dias.forEach((set,mi)=>set.forEach(d=>g.ds.push(dnum(isoOf(ano,mi+1,d))))); g.ds.sort((a,b)=>a-b);
    if(g.ds.length){ const l=g.ds[g.ds.length-1]; if(ultimo===null||l>ultimo) ultimo=l; }
  });
  const ultimoISO=ultimo===null?null:dfrom(ultimo), H=hoje(), meds=[], eps=[]; let seq=1, dm=0;
  [...grupos.values()].sort(cmpNome).forEach(g=>{
    const id='m'+(seq++); meds.push({id,nome:g.nome,alias:g.alias}); const ds=g.ds; dm+=ds.length;
    for(let i=0;i<ds.length;){
      let j=i; while(j+1<ds.length && ds[j+1]===ds[j]+1) j++;
      const ini=dfrom(ds[i]), fimD=dfrom(ds[j]);
      const aberto=ultimoISO && fimD===ultimoISO && diffDays(ultimoISO,H)<=7;

function lerCSV(bytes){
  let txt; try{ txt=new TextDecoder('utf-8',{fatal:true}).decode(bytes); }catch(e){ txt=new TextDecoder('windows-1252').decode(bytes); }
  const linhas=txt.replace(/^\uFEFF/,'').split(/\r?\n/);
  const hi=linhas.findIndex(l=>norm(l).includes('MEDICAMENTO/PRODUTO'));
  if(hi<0) throw new Error('Não encontrei o cabeçalho "Medicamento/produto". Este importador espera o CSV "medicamentoEmFalta".');
  let dataLista=null, m;
  for(let i=0;i<hi;i++){ if((m=linhas[i].match(/Data Cadastro:\s*;?\s*(\d{2}\/\d{2}\/\d{4})/i))) dataLista=parseDataQualquer(m[1]); }
  const itens=[];
  for(let i=hi+1;i<linhas.length;i++){
    const l=linhas[i]; if(!l.trim()) continue;
    const p=l.split(';').map(x=>x.replace(/^\s*"|"\s*$/g,'').trim()); if(p.length<5) continue;
    const nome=decodeEnt(p.slice(2,p.length-2).join(';')).replace(/\s+/g,' ').trim(); if(!nome) continue;
    itens.push({sigf:p[0],siad:p[1],nome,k:norm(nome),desab:p[p.length-2],status:p[p.length-1]});
  }
  return {dataLista,itens};
}
async function iniciarCSV(file){
  const csv=lerCSV(new Uint8Array(await file.arrayBuffer()));
  if(!S.meds.length){ return modalMsg('Importe o histórico primeiro','<p>Ainda não há medicamentos cadastrados. Comece pela importação do <b>Med_em_falta_Consolidado</b>.</p>'); }
  const totais=[], visto=new Set();
  csv.itens.forEach(i=>{ if(norm(i.status)==='TOTALMENTE DESABASTECIDO' && !visto.has(i.k)){ visto.add(i.k); totais.push(i); } });
  PLAN={tipo:'csv',arquivo:file.name,csv,totais,dataLanc:hoje(),escolha:{},incluir:{},motivo:{},salvos:{}};
  totais.forEach(t=>{ if(!achaMed(t.nome)){ const s=sugerir(t.nome); PLAN.escolha[t.k]=(s[0]&&s[0].score>=0.75)?s[0].med.id:'__novo'; } });
  abrirInline(renderCSV);
}

const fechadaOntem=(medId,dl)=>(IDX.eps.get(medId)||[]).find(e=>e.fim===addDays(dl,-1));

function resolverCSV(P){
  const linhas=[]; const usados=new Set(), dl=P.dataLanc;
  P.totais.forEach(t=>{
    let medId=achaMed(t.nome), semCad=false;
    if(!medId){ semCad=true; const e=P.escolha[t.k]; medId=(e&&e!=='__novo')?e:null; }
    const ab=medId?(epAberto(medId)||fechadaOntem(medId,dl)):null;
    const dup=medId&&usados.has(medId); if(medId) usados.add(medId);
    linhas.push({t,medId,semCad,estado:(medId&&ab)?'continua':'novo',dup});
  });
  const ids=new Set(linhas.filter(l=>l.medId).map(l=>l.medId));
  const sai=S.eps.filter(e=>!e.fim&&e.motivo!==MOTIVO_SUSP&&!ids.has(e.med));
  return {linhas,sai};
}

ACT.csvAplicar=()=>{
  const P=PLAN, dl=P.dataLanc; guardarAnterior(); RECENT.clear(); UI.sit='aberto';
  let criados=0, novos=0, enc=0, cont=0, rem=0, vinc=0;
  P.totais.forEach(t=>{           // 1) resolve/cadastra medicamentos
    let medId=achaMed(t.nome);
    if(!medId){ const e=P.escolha[t.k];
      if(e&&e!=='__novo'){ medId=e; const m=S.meds.find(x=>x.id===e); (m.alias=m.alias||[]).push(t.nome); vinc++; }
      else { medId=nid('m'); S.meds.push({id:medId,nome:t.nome,alias:[],origem:'importado'}); criados++; } }
    t._med=medId; reindex();
  });
  const ids=new Set(P.totais.map(t=>t._med));
  // 2) sobrescreve: tudo que não está na lista mais recente sai (exceto suspensos)
  S.eps.filter(e=>!e.fim&&e.motivo!==MOTIVO_SUSP&&!ids.has(e.med)).forEach(e=>{
    if(descartavelCSV(e,dl)){ S.eps.splice(S.eps.indexOf(e),1); rem++; }
    else { const f=addDays(dl,-1); e.fim=f<e.ini?e.ini:f; e.lista=false; enc++; }
  });
  reindex();
  const vistos=new Set();
  P.totais.forEach(t=>{           // 3) quem está na lista fica em falta
    const medId=t._med; if(vistos.has(medId)) return; vistos.add(medId);
    let ab=epAberto(medId);
    if(!ab){ const ont=fechadaOntem(medId,dl); if(ont){ ont.fim=null; ab=ont; } }   // fechada ontem por outra lista: continua
    if(ab){ ab.lista=true; cont++; }
    else if(P.incluir[t.k]!==false){
      let ini=dl; const fechados=(IDX.eps.get(medId)||[]).filter(e=>e.fim&&e.fim>=ini);
      if(fechados.length) ini=addDays(fechados.reduce((m,e)=>e.fim>m?e.fim:m,ini),1);
      const idN=nid('e'); RECENT.add(idN);
      S.eps.push({id:idN,med:medId,ini,fim:null,motivo:P.motivo[t.k],mi:true,lista:true,prev:'',iniIncerto:false,origem:'csv'}); novos++;
    }
  });
  S.csv={arquivo:P.arquivo,dataLista:P.csv.dataLista,dataLanc:dl,aplicadoEm:agoraBR(),total:ids.size};
  logar('Lista diária (CSV)',P.arquivo,`substituiu a anterior · ${novos} ${plural(novos,'nova','novas')} · ${enc} ${plural(enc,'encerrada','encerradas')} · ${cont} continuam${rem?` · ${rem} da lista anterior removidas`:''}${criados?` · ${criados} cadastrados`:''}${(vinc+Object.keys(P.salvos).length)?` · ${vinc+Object.keys(P.salvos).length} vínculos de nome salvos`:''}`);
  fecharModal(); commit(); { const nv=vinc+Object.keys(P.salvos).length; toast(`Lista aplicada (substitui a anterior): ${novos} novas, ${enc} encerradas, ${cont} continuam.${nv?` ✓ ${nv} ${plural(nv,'vínculo de nome salvo','vínculos de nome salvos')}.`:''}`,5500); }
};

function pickFiltrar(q){
  const n=norm(q||'').trim();
  let L=[...S.meds];
  if(!n){ L.sort(cmpNome); return L; }
  const toks=n.split(' ').filter(Boolean);
  L=L.filter(m=>{ const hay=norm(m.nome)+' '+(m.alias||[]).map(norm).join(' '); return toks.every(t=>hay.includes(t)); });
  const t0=toks[0];

}

/* O histórico vem dia a dia: um mesmo medicamento costuma ter vários períodos separados por poucos dias
   (fins de semana, dias sem registro). Ao estender um período sobre os vizinhos, eles são unidos a ele
   (os que ficam inteiros dentro são absorvidos; os que encostam só em parte são encurtados) em vez de recusar. */
function planoUniao(e,ini,fim){
  const acoes=[];
  for(const o of (IDX.eps.get(e.med)||[])){
    if(o.id===e.id || (o.fim&&o.fim<ini) || (fim&&fim<o.ini)) continue;
    const intervalo=`${fmtBR(o.ini)} a ${o.fim?fmtBR(o.fim):'em aberto'}`;
    if(o.ini>=ini && (fim===null || (o.fim && o.fim<=fim))){ acoes.push({o,tipo:'apaga'}); continue; }
    if(o.ini<ini){
      if(fim===null ? !o.fim : (!o.fim || o.fim>fim)) return {erro:`Esta data fica inteira dentro de outra falta deste medicamento (${intervalo}). Ajuste ou exclua aquela linha.`};
      acoes.push({o,tipo:'fim',val:addDays(ini,-1)});
    } else acoes.push({o,tipo:'ini',val:addDays(fim,1)});
  }
  return {acoes,n:acoes.length};
}
function aplicarUniao(e,pl){
  pl.acoes.forEach(a=>{ const o=a.o;
    if(a.tipo==='apaga'){ if(!e.prev&&o.prev) e.prev=o.prev; if(o.lista===true&&!o.fim) e.lista=true; S.eps.splice(S.eps.indexOf(o),1); RECENT.delete(o.id); }
    else if(a.tipo==='fim') o.fim=a.val;
    else { o.ini=a.val; o.iniIncerto=false; } });
  if(pl.n) logar('Faltas unidas',medDe(e).nome,`${pl.n} ${plural(pl.n,'período vizinho ajustado','períodos vizinhos ajustados')}`);
}
function gravarComUniao(e,t,pl,msg){
  if(!pl.n){ gravarLinha(e,t); if(msg) toast(msg); return; }
  reindex(); salvar(); renderGrade(); atualizarResumo();
  toast(`${msg?msg+' ':''}${pl.n} ${plural(pl.n,'outra falta registrada deste medicamento foi unida','outras faltas registradas deste medicamento foram unidas')} a este período.`,6000);
}
BLUR.gIni=t=>{
  const e=achaEp(t.dataset.id); if(!e) return; const v=t.value; if(v===e.ini) return;
  if(!v||t.validity.badInput||!validISO(v)) return recusar(t,'Informe a data completa do início (dia/mês/ano).',e.ini);
  if(e.fim&&v>e.fim) return recusar(t,'O início não pode ser depois do último dia em falta.',e.ini);
  const pl=planoUniao(e,v,e.fim); if(pl.erro) return recusar(t,pl.erro,e.ini);
  aplicarUniao(e,pl); e.ini=v;
  if(e.iniIncerto){ e.iniIncerto=false; const b=t.parentElement.querySelector('.badge'); if(b) b.remove(); }
  gravarComUniao(e,t,pl,'');
};
BLUR.gPrev=t=>{

BLUR.gVolta=t=>{
  const e=achaEp(t.dataset.id); if(!e) return; const atual=e.fim?addDays(e.fim,1):'', v=t.value; if(v===atual) return;
  if(t.validity.badInput) return recusar(t,'Data incompleta.',atual);
  if(!v){
    const pl=planoUniao(e,e.ini,null); if(pl.erro) return recusar(t,pl.erro,atual);
    aplicarUniao(e,pl); e.fim=null; logar('Falta reaberta',medDe(e).nome,`desde ${fmtBR(e.ini)}`); gravarComUniao(e,t,pl,'Falta reaberta.'); return;
  }
  if(!validISO(v)) return recusar(t,'Data inválida.',atual);
  const fim=addDays(v,-1);
  if(fim<e.ini) return recusar(t,'A volta ao estoque precisa ser depois do dia 1 em falta. Se foi lançado por engano, use Excluir.',atual);

  logar(era?'Falta ajustada':'Falta encerrada',medDe(e).nome,`de ${fmtBR(e.ini)} a ${fmtBR(fim)}`);

ACT.registrar=()=>{
  const nome=$('#rgMed').value.trim(), motivo=$('#rgMot').value, ini=$('#rgIni').value;
  if(!nome) return msgRg('Escolha o medicamento.');
  const medId=achaMed(nome);
  if(!medId) return msgRg(`“${esc(nome)}” não está no cadastro. Escolha um item da lista ou <button class="btn sm link" data-act="cadReg">cadastrar como novo medicamento</button>.`);
  if(!motivo) return msgRg('Escolha o motivo da falta.');
  if(!validISO(ini)) return msgRg('Informe a data do dia 1 em falta.');
  const ab=epAberto(medId); if(ab) return msgRg(`Este medicamento já está em falta desde ${fmtBR(ab.ini)} — ajuste direto na tabela abaixo.`);

function timelineSVG(prev,comp,C){
  const W=900,Hh=92,px=14,x0=px,x1=W-px,n=Math.max(diffDays(prev,comp),1), X=d=>x0+(diffDays(prev,d)/n)*(x1-x0);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Linha do tempo entre o retorno previsto e o comparecimento, com os dias em falta destacados"><rect x="${x0}" y="28" width="${x1-x0}" height="26" rx="6" fill="#DCE3CC"/>`;
  C.partes.forEach(p=>{ const a=X(p.de), b=X(addDays(p.ate,1)); s+=`<rect x="${a}" y="28" width="${Math.max(b-a,1.5)}" height="26" fill="#B3261E"><title>${fmtBR(p.de)} a ${fmtBR(p.ate)} · ${p.dias} dias</title></rect>`; });
  let d=new Date(prev+'T00:00:00Z'); d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));
  for(;;){ const iso=isoOf(d.getUTCFullYear(),d.getUTCMonth()+1,1); if(iso>=comp) break; const x=X(iso); s+=`<line x1="${x}" x2="${x}" y1="54" y2="62" stroke="#5A6350"/><text x="${x}" y="76" font-size="12" text-anchor="middle" fill="#5A6350">${MESES_ABR[d.getUTCMonth()]}</text>`; d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)); }
  s+=`<text x="${x0}" y="18" font-size="12" fill="#2B3324" font-weight="700">${fmtBR(prev)}</text><text x="${x1}" y="18" font-size="12" text-anchor="end" fill="#2B3324" font-weight="700">${fmtBR(comp)}</text></svg>`;
  return s;
}

    ${v}${aviso}${C.atraso>0?timelineSVG(CONS.prev,comp,C)+'<p class="muted small" style="margin:2px 0 10px">Trecho vermelho = dias em falta.</p>':''}${tab}
    <p class="muted small">Regra aplicada: o paciente não perde o processo quando os dias em falta cobrem o atraso (tolerância configurada em Parametrização: ${C.tol} ${plural(C.tol,'dia')}). Conta os dias de ${fmtBR(CONS.prev)} até o dia anterior ao comparecimento.</p>`;
}

function baixar(dados,nome,mime){
  const blob=dados instanceof Blob?dados:new Blob([dados],{type:mime});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();

}
const MIME_XLSX='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
/* Toda exportação abre a janela "Salvar como" para o usuário escolher a pasta e o nome.
   A janela é pedida ANTES de gerar o arquivo (o navegador só a permite logo após o clique). */
const TIPOS_ARQ={xlsx:{description:'Planilha do Excel',accept:{[MIME_XLSX]:['.xlsx']}},pdf:{description:'Documento PDF',accept:{'application/pdf':['.pdf']}},json:{description:'Backup',accept:{'application/json':['.json']}}};
class ExpCancelada extends Error{}
async function pedirDestino(nome){
  if(typeof window.showSaveFilePicker!=='function') return null;
  const ext=nome.split('.').pop().toLowerCase();
  try{ return await window.showSaveFilePicker({suggestedName:nome,types:TIPOS_ARQ[ext]?[TIPOS_ARQ[ext]]:undefined}); }
  catch(e){ if(e&&e.name==='AbortError') throw new ExpCancelada(); return null; }   // bloqueado neste ambiente: usa o download
}
async function exportar(nome,mime,gerar,okMsg){
  let h=null;
  try{ h=await pedirDestino(nome); }catch(e){ if(e instanceof ExpCancelada){ toast('Exportação cancelada.'); return false; } }
  try{
    toast('Gerando '+nome+'…');
    const dados=await gerar(), blob=dados instanceof Blob?dados:new Blob([dados],{type:mime});
    if(h){ const w=await h.createWritable(); await w.write(blob); await w.close(); toast(`${okMsg||'Arquivo salvo'}: ${h.name}`,5000); }
    else { baixar(blob,nome,mime); toast(`${okMsg||'Arquivo gerado'}. Este navegador não permite abrir a janela “Salvar como” por aqui — para ele sempre perguntar a pasta, ative “Perguntar onde salvar cada arquivo” nas configurações de downloads do navegador.`,9000); }
    return true;
  }catch(err){ console.error(err); modalMsg('Não foi possível gerar o arquivo',`<p>${esc(err.message||err)}</p>`); return false; }
}

/* Desenha a planilha num doc com a fonte fs. Retorna o doc (pode ter mais de 1 página). */
function desenharPlanilhaPDF(P,Sp,fs,ori){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'mm',format:'a4',orientation:ori}), H=hoje();
  const W=doc.internal.pageSize.getWidth(), Hpg=doc.internal.pageSize.getHeight(), mg=8;
  const tit=Math.min(18,Math.max(11,fs+4)), sub=Math.min(11,Math.max(7,fs));
  doc.setFont('helvetica','bold'); doc.setFontSize(tit); doc.setTextColor(49,133,156); doc.text('Planilha de Faltas de Medicamentos',mg,mg+tit*0.35);
  let y=mg+tit*0.35+sub*0.45;
  doc.setFont('helvetica','normal'); doc.setFontSize(sub); doc.setTextColor(90,99,80);
  doc.text(`Atualização: ${dataHoraArq()}   |   Referência: ${fmtBR(H)}   |   ${P.length} ${plural(P.length,'medicamento em falta','medicamentos em falta')}${Sp.length?` + ${Sp.length} ${plural(Sp.length,'suspenso')}`:''}`,mg,y);
  y+=sub*0.3;
  const corpo=l=>l.map(x=>[x.nome,fmtBR(x.ini),String(x.dias),txtPrev(x.prev)]);
  const escala=l=>{ const ds=l.map(x=>dnum(x.ini)); const mn=Math.min(...ds), mx=Math.max(...ds);
    return x=>{ const t=mx>mn?(dnum(x.ini)-mn)/(mx-mn):1, c1=[248,105,107], c2=[252,252,255];
      return c1.map((v,i)=>Math.round(v+(c2[i]-v)*t)); }; };
  const pad=Math.max(.5,fs*.14);
  const base=(cor,L,cor1)=>({theme:'grid',margin:{left:mg,right:mg,top:mg,bottom:mg+4},rowPageBreak:'avoid',
    styles:{font:'helvetica',fontSize:fs,cellPadding:pad,lineColor:[170,170,170],lineWidth:.15,textColor:[20,20,20],overflow:'linebreak',valign:'middle',halign:'center'},
    headStyles:{fillColor:cor,textColor:[20,45,55],halign:'center',fontStyle:'bold',fontSize:Math.max(fs*.85,4)},
    columnStyles:{0:{cellWidth:larg[0],halign:'left'},1:{cellWidth:larg[1]},2:{cellWidth:larg[2]},3:{cellWidth:larg[3]}},
    didParseCell:d=>{ if(d.section!=='body') return;
      if(d.column.index===1&&L[d.row.index]) d.cell.styles.fillColor=cor1(L[d.row.index]);
      if(d.column.index===2) d.cell.styles.fontStyle='bold'; }});
  const cabec=['Medicamento em falta','Entrada em falta','Dias em falta','Previsão chegada'];
  /* Larguras fixas e iguais nas duas tabelas, medidas no tamanho de fonte atual:
     nenhuma palavra é quebrada no meio; o nome do medicamento fica com o espaço que sobra. */
  const util=W-2*mg, hfs=Math.max(fs*.85,4), todas=[...P,...Sp], linhas=corpo(todas);
  const mede=(txt,tam,bold)=>{ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(tam); return doc.getTextWidth(String(txt)); };
  const maiorPalavra=(txt,tam,bold)=>Math.max(0,...String(txt).split(/\s+/).map(p=>mede(p,tam,bold)));
  const larg=[0];
  for(let c=1;c<=3;c++){
    const corpoW=Math.max(0,...linhas.map(l=>mede(l[c],fs,c===2)));
    const cabW=maiorPalavra(cabec[c],hfs,true);
    larg[c]=Math.max(corpoW,cabW)+2*pad+0.6;
  }
  larg[0]=util-larg.slice(1).reduce((a,b)=>a+b,0);
  const minNome=Math.max(maiorPalavra(cabec[0],hfs,true),...todas.map(x=>maiorPalavra(x.nome,fs,false)))+2*pad+0.6;
  let cabeLargura=larg[0]>=Math.max(minNome,util*0.28);
  if(!cabeLargura) larg[0]=Math.max(larg[0],10);
  doc.autoTable({...base([183,222,232],P,escala(P.length?P:[{ini:H}])),startY:y+1,head:[cabec],
    body:P.length?corpo(P):[[{content:'Nenhum medicamento em falta na lista.',colSpan:4,styles:{halign:'center',textColor:[90,99,80]}}]]});
  if(Sp.length){
    let y2=doc.lastAutoTable.finalY+sub*0.55;
    doc.setFont('helvetica','bold'); doc.setFontSize(sub); doc.setTextColor(110,140,60); doc.text('Medicamento suspenso temporário',mg,y2);
    doc.autoTable({...base([215,228,189],Sp,escala(Sp)),startY:y2+1,head:[cabec],body:corpo(Sp)});
  }
  doc.__cabe=cabeLargura;
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(120,128,110);
    doc.text(n>1?`Página ${i} de ${n}`:'',W-mg,Hpg-4,{align:'right'}); doc.text('Controle de faltas de medicamentos',mg,Hpg-4); }
  return doc;
}
/* Procura a MAIOR fonte em que tudo cabe em UMA página (retrato ou paisagem, o que der fonte maior). */
function gerarPlanilhaPDF(P,Sp){
  const cabe=(fs,ori)=>{ const d=desenharPlanilhaPDF(P,Sp,fs,ori); return d.__cabe && d.internal.getNumberOfPages()===1; };
  let melhor={fs:0,ori:'portrait'}; const aviso=console.warn; console.warn=()=>{};   // silencia avisos da busca
  try{
  ['portrait','landscape'].forEach(ori=>{
    let lo=2, hi=22; if(!cabe(lo,ori)) return;
    while(hi-lo>0.1){ const m=(lo+hi)/2; if(cabe(m,ori)) lo=m; else hi=m; }
    if(lo>melhor.fs+0.05) melhor={fs:lo,ori};
  }); } finally { console.warn=aviso; }
  if(!melhor.fs) melhor={fs:2,ori:'landscape'};   // lista enorme: menor fonte possível
  return desenharPlanilhaPDF(P,Sp,Math.floor(melhor.fs*10)/10,melhor.ori).output('blob');
}

async function gerarIndicador(ano){
  libExcel();
  const wb=new ExcelJS.Workbook(); wb.creator='Controle de faltas de medicamentos'; wb.created=new Date();
  const info=[], sep={left:{style:'thin',color:{argb:'FFBFBFBF'}},right:{style:'thin',color:{argb:'FFBFBFBF'}}};
  MESES.forEach((mes,mi)=>{
    const {rows,denom}=indicadorMes(ano,mi), nd=rows.length;
    const ws=wb.addWorksheet(mes,{views:[{state:'frozen',ySplit:1,showGridLines:false}],
      pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:'1:1',margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}}});
    [8.5,17,14,17,14,17.5,15.5].forEach((w,i)=>ws.getColumn(i+1).width=w);
    const h=ws.getRow(1); h.height=60;
    ['Dia Mês',...MOTIVOS.map(m=>m.cab),'Nº Medicamentos em Falta','Percentual de Falta'].forEach((t,i)=>{
      const c=h.getCell(i+1); c.value=t; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border=sep; });
    h.getCell(1).font={bold:false};
    rows.forEach((r,i)=>{
      const row=ws.getRow(i+2); row.getCell(1).value=r.dia; row.getCell(1).font={bold:true}; row.getCell(1).alignment={horizontal:'center'};
      if(!r.vazio){ ['md','ee','ds','rf'].forEach((k,j)=>{ if(r[k]||j<2) row.getCell(j+2).value=r[k]||0; }); }
      if(!r.vazio){   // dias futuros ficam em branco (o gráfico mostra lacuna, não zero)
        row.getCell(6).value={formula:`SUM(B${i+2}:C${i+2})`,result:r.n};
        row.getCell(7).value={formula:`F${i+2}*100/${denom}`,result:r.pct}; }
      row.getCell(7).numFmt='0.00';
      for(let c=1;c<=7;c++){ row.getCell(c).alignment={horizontal:'center'}; row.getCell(c).border=sep; }
    });
    info.push({mes,nd});
  });
  let buf=await wb.xlsx.writeBuffer(), graficos=false;
  if(typeof JSZip!=='undefined'){ try{ buf=await injetarGraficos(buf,info); graficos=true; }catch(e){ console.error('gráficos',e); } }
  return {buf,graficos};
}

const NS_C='http://schemas.openxmlformats.org/drawingml/2006/chart', NS_A='http://schemas.openxmlformats.org/drawingml/2006/main', NS_R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function xmlSerie(idx,mes,nd,colTxt,cor){
  const q=`'${xmlEsc(mes)}'`;
  return `<c:ser><c:idx val="${idx}"/><c:order val="${idx}"/><c:tx><c:strRef><c:f>${q}!$${colTxt}$1</c:f></c:strRef></c:tx><c:spPr><a:solidFill><a:srgbClr val="${cor}"/></a:solidFill></c:spPr><c:invertIfNegative val="0"/>
   <c:cat><c:numRef><c:f>${q}!$A$2:$A$${nd+1}</c:f></c:numRef></c:cat><c:val><c:numRef><c:f>${q}!$${colTxt}$2:$${colTxt}$${nd+1}</c:f></c:numRef></c:val></c:ser>`;
}
function xmlGrafico(titulo,series,legenda,fmt){
  const tx=t=>`<c:title><c:tx><c:rich><a:bodyPr/><a:p><a:pPr><a:defRPr sz="1200" b="1"/></a:pPr><a:r><a:rPr lang="pt-BR" sz="1200" b="1"/><a:t>${xmlEsc(t)}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<c:chartSpace xmlns:c="${NS_C}" xmlns:a="${NS_A}" xmlns:r="${NS_R}"><c:roundedCorners val="0"/><c:chart>${tx(titulo)}<c:autoTitleDeleted val="0"/><c:plotArea><c:layout/>
<c:barChart><c:barDir val="col"/><c:grouping val="clustered"/><c:varyColors val="0"/>${series}<c:gapWidth val="60"/><c:axId val="111111111"/><c:axId val="222222222"/></c:barChart>
<c:catAx><c:axId val="111111111"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="b"/><c:numFmt formatCode="General" sourceLinked="1"/><c:majorTickMark val="out"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:crossAx val="222222222"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>
<c:valAx><c:axId val="222222222"/><c:scaling><c:orientation val="minMax"/><c:min val="0"/></c:scaling><c:delete val="0"/><c:axPos val="l"/><c:majorGridlines><c:spPr><a:ln w="6350"><a:solidFill><a:srgbClr val="D9D9D9"/></a:solidFill></a:ln></c:spPr></c:majorGridlines><c:numFmt formatCode="${fmt}" sourceLinked="0"/><c:majorTickMark val="out"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:crossAx val="111111111"/><c:crosses val="autoZero"/><c:crossBetween val="between"/></c:valAx>
</c:plotArea>${legenda?'<c:legend><c:legendPos val="b"/><c:overlay val="0"/></c:legend>':''}<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart></c:chartSpace>`;
}
function xmlAncora(id,rid,c0,r0,c1,r1,nome){
  return `<xdr:twoCellAnchor><xdr:from><xdr:col>${c0}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${r0}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>${c1}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${r1}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>
  <xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${id}" name="${xmlEsc(nome)}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm>
  <a:graphic><a:graphicData uri="${NS_C}"><c:chart xmlns:c="${NS_C}" xmlns:r="${NS_R}" r:id="${rid}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`;
}
async function injetarGraficos(buf,info){
  const zip=await JSZip.loadAsync(buf); let ct=await zip.file('[Content_Types].xml').async('string'); let extraCT='';
  for(let i=0;i<info.length;i++){
    const n=i+1, {mes,nd}=info[i], c1=2*i+1, c2=2*i+2, shPath=`xl/worksheets/sheet${n}.xml`;
    const sh=zip.file(shPath); if(!sh) throw new Error('planilha '+n+' não encontrada');
    let x=await sh.async('string');
    if(!/xmlns:r=/.test(x)) x=x.replace('<worksheet ',`<worksheet xmlns:r="${NS_R}" `);
    x=x.replace('</worksheet>',`<drawing r:id="rIdGraf1"/></worksheet>`); zip.file(shPath,x);
    const relPath=`xl/worksheets/_rels/sheet${n}.xml.rels`, novo=`<Relationship Id="rIdGraf1" Type="${NS_R}/drawing" Target="../drawings/drawing${n}.xml"/>`;
    const ex=zip.file(relPath);
    if(ex){ const t=await ex.async('string'); zip.file(relPath,t.replace('</Relationships>',novo+'</Relationships>')); }
    else zip.file(relPath,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${novo}</Relationships>`);
    zip.file(`xl/drawings/drawing${n}.xml`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="${NS_A}">${xmlAncora(2,'rId1',8,0,20,16,'Percentual diário')}${xmlAncora(3,'rId2',8,17,20,33,'Almox x Estoque Estadual')}</xdr:wsDr>`);
    zip.file(`xl/drawings/_rels/drawing${n}.xml.rels`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${NS_R}/chart" Target="../charts/chart${c1}.xml"/><Relationship Id="rId2" Type="${NS_R}/chart" Target="../charts/chart${c2}.xml"/></Relationships>`);
    zip.file(`xl/charts/chart${c1}.xml`,xmlGrafico('Percentual de Falta de Medicamentos por Dia',xmlSerie(0,mes,nd,'G','9BBB59'),false,'0'));
    zip.file(`xl/charts/chart${c2}.xml`,xmlGrafico('Média de Faltas Almox / Estado',xmlSerie(0,mes,nd,'B','8AA64F')+xmlSerie(1,mes,nd,'C','B8CD97'),true,'0'));
    extraCT+=`<Override PartName="/xl/drawings/drawing${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/><Override PartName="/xl/charts/chart${c1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/><Override PartName="/xl/charts/chart${c2}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`;
  }
  zip.file('[Content_Types].xml',ct.replace('</Types>',extraCT+'</Types>'));
  return zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'});
}

function medsFiltrados(){
  const q=norm(PM.busca);
  return [...S.meds].sort(cmpNome).filter(m=>{
    if(q && !norm(m.nome).includes(q) && !(m.alias||[]).some(a=>norm(a).includes(q))) return false;
    if(PM.filtro==='falta' && !epAberto(m.id)) return false;
    if(PM.filtro==='semfalta' && epAberto(m.id)) return false;
    if(PM.filtro==='importado' && m.origem!=='importado') return false;
    if(PM.filtro==='manual' && m.origem!=='manual') return false;
    return true;
  });
}
function medBadge(m){
  if(m.origem==='importado') return ` <span class="medb"><span class="suggested-badge" style="background:var(--sage-dark)" title="Criado automaticamente durante uma importação — o nome não foi reconhecido no cadastro. Confira se não é um medicamento já existente com outro nome (Unir a outro).">🆕 Novo — revisar</span><button class="btn sm link" data-act="medRevisado" data-id="${m.id}">marcar como revisado</button></span>`;
  if(m.origem==='manual') return ' <span class="medb"><span class="suggested-badge" title="Adicionado manualmente ao cadastro.">🆕 Adicionado manualmente</span></span>';
  return '';
}
/* nome e sinônimos editáveis direto na linha — grava ao sair do campo */
function camposMed(m){
  const p=parecidosCom(m,1)[0];
  const sug=p?`<span class="alias">Mais parecido no cadastro: <b>${esc(p.med.nome)}</b> (${Math.round(p.score*100)}%)
      <button class="btn sm link" data-act="medAddAlias" data-id="${m.id}" data-alvo="${p.med.id}" title="Acrescenta este nome em “outros nomes”">usar como outro nome</button>
      <button class="btn sm link" data-act="medUnir" data-id="${m.id}">unir a este</button></span>`:'';
  return `<input type="text" class="inl" value="${esc(m.nome)}" data-blur="medNome" data-id="${m.id}" aria-label="Nome do medicamento">
    <input type="text" class="inl al" value="${esc((m.alias||[]).join('; '))}" data-blur="medAlias" data-id="${m.id}" placeholder="${p?'Sugestão: '+esc(p.med.nome):'Outros nomes reconhecidos (separe com ;)'}" aria-label="Outros nomes reconhecidos">${sug}${medBadge(m)}`;
}
ACT.medAddAlias=b=>{
  const m=S.meds.find(x=>x.id===b.dataset.id), a=S.meds.find(x=>x.id===b.dataset.alvo); if(!m||!a) return;
  abrirModal(()=>({titulo:'Usar como outro nome',narrow:true,corpo:`<p style="margin-top:0">“${esc(a.nome)}” já é um medicamento do cadastro${(IDX.eps.get(a.id)||[]).length?' e tem faltas registradas':''}. Para que esse nome passe a ser reconhecido como <b>${esc(m.nome)}</b>, os dois precisam ser unidos: as faltas de “${esc(a.nome)}” passam para <b>${esc(m.nome)}</b> e o nome vira “outro nome”.</p>`,
    rodape:`<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" data-act="medUnirDireto" data-de="${a.id}" data-para="${m.id}">Unir e usar como outro nome</button>`}));
};
function tirarBadge(t){ const w=t.closest('td,.med-card'); const b=w&&w.querySelector('.medb'); if(b) b.remove(); }
BLUR.medNome=t=>{
  const m=S.meds.find(x=>x.id===t.dataset.id); if(!m) return;
  const nome=t.value.replace(/\s+/g,' ').trim(); if(nome===m.nome){ t.value=m.nome; return; }
  if(!nome) return recusar(t,'O nome não pode ficar vazio.',m.nome);
  if(!nomeLivre(nome,m.id)) return recusar(t,`“${nome}” já pertence a outro medicamento. Para juntar os dois, use “Unir a outro”.`,m.nome);
  logar('Cadastro',nome,`renomeado (antes: ${m.nome})`);
  m.nome=nome; m.alias=(m.alias||[]).filter(a=>norm(a)!==norm(nome)); delete m.origem; tirarBadge(t);
  t.value=nome; reindex(); salvar(); marcarSalvo(t);
};
BLUR.medAlias=t=>{
  const m=S.meds.find(x=>x.id===t.dataset.id); if(!m) return; const antes=(m.alias||[]).join('; ');
  const lista=[...new Set(t.value.split(/[;\n]/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&norm(x)!==norm(m.nome)))];
  if(lista.join('; ')===antes){ t.value=antes; return; }
  for(const n of lista){ if(!nomeLivre(n,m.id)) return recusar(t,`“${n}” já pertence a outro medicamento.`,antes); }
  m.alias=lista; t.value=lista.join('; '); reindex(); salvar(); marcarSalvo(t);
};
ACT.medRevisado=b=>{ const m=S.meds.find(x=>x.id===b.dataset.id); if(!m) return; delete m.origem; const w=b.closest('.medb'); if(w) w.remove(); salvar(); toast('Marcado como revisado.'); };
function renderMedsParam(){
  const box=$('#pmMeds'), cnt=$('#pmCount'); if(!box) return;
  if(!S.meds.length){ box.innerHTML='<div class="empty"><b>Cadastro vazio</b>Importe o histórico ou adicione um medicamento.</div>'; if(cnt) cnt.textContent='0 medicamentos'; atualizarBulkBar(); return; }
  const nEps=new Map(); S.eps.forEach(e=>nEps.set(e.med,(nEps.get(e.med)||0)+1));
  const L=medsFiltrados(), LIM=300, vis=L.slice(0,LIM);
  if(cnt) cnt.textContent=`${L.length} de ${S.meds.length} ${plural(S.meds.length,'medicamento')}`;
  [...PMSEL].forEach(id=>{ if(!S.meds.find(m=>m.id===id)) PMSEL.delete(id); });
  if(!L.length){ box.innerHTML='<div class="empty"><b>Nada encontrado</b>Ajuste a busca ou o filtro.</div>'; atualizarBulkBar(); return; }
  const nota=L.length>LIM?`<p class="muted small">Mostrando os primeiros ${LIM} de ${L.length} — refine a busca.</p>`:'';
  if(PM.view==='card'){
    box.innerHTML=vis.map(m=>{ const ab=epAberto(m.id);
      return `<div class="med-card"><div class="mc-top"><input type="checkbox" class="lote-checkbox" data-id="${m.id}" ${PMSEL.has(m.id)?'checked':''}>
        <div class="mc-name">${camposMed(m)}</div></div>
        <div class="mc-row">${ab?'<span class="badge b-red">em falta</span>':'<span class="badge b-gray">sem falta</span>'} <span>${nEps.get(m.id)||0} ${plural(nEps.get(m.id)||0,'falta registrada','faltas registradas')}</span></div>
        <div class="mc-actions"><button class="btn sm ghost" data-act="medUnir" data-id="${m.id}">Unir a outro</button><button class="btn sm link" data-act="medExcluir" data-id="${m.id}">Excluir</button></div></div>`; }).join('')+nota;
  } else {
    box.innerHTML=`<div class="tbl-wrap"><table class="t"><thead><tr><th style="width:20px"><input type="checkbox" id="pmSelectAll"></th><th>Medicamento e outros nomes reconhecidos</th><th class="num">Faltas</th><th>Situação</th><th></th></tr></thead><tbody>
      ${vis.map(m=>{ const ab=epAberto(m.id);
        return `<tr><td style="text-align:center"><input type="checkbox" class="lote-checkbox" data-id="${m.id}" ${PMSEL.has(m.id)?'checked':''}></td>
        <td class="name" style="min-width:340px">${camposMed(m)}</td><td class="num">${nEps.get(m.id)||0}</td>
        <td>${ab?'<span class="badge b-red">em falta</span>':'<span class="muted small">—</span>'}</td>
        <td style="white-space:nowrap"><button class="btn sm ghost" data-act="medUnir" data-id="${m.id}">Unir a outro</button> <button class="btn sm link" data-act="medExcluir" data-id="${m.id}">Excluir</button></td></tr>`; }).join('')}</tbody></table></div>${nota}`;
    const selAll=$('#pmSelectAll'); if(selAll){ selAll.checked=vis.length>0&&vis.every(m=>PMSEL.has(m.id)); selAll.onchange=()=>{ vis.forEach(m=>selAll.checked?PMSEL.add(m.id):PMSEL.delete(m.id)); renderMedsParam(); }; }
  }
  $$('#pmMeds .lote-checkbox').forEach(cb=>cb.onchange=()=>{ cb.checked?PMSEL.add(cb.dataset.id):PMSEL.delete(cb.dataset.id); atualizarBulkBar(); if(PM.view==='table'){ const selAll=$('#pmSelectAll'); if(selAll) selAll.checked=vis.length>0&&vis.every(m=>PMSEL.has(m.id)); } });
  atualizarBulkBar();
}
function atualizarBulkBar(){
  const n=PMSEL.size, p=$('#pmSelCount'), b=$('.bulk-bar button[data-act="pmBulkExcluir"]');
  if(p) p.textContent=`${n} ${plural(n,'selecionado')}`;
  if(b) b.disabled=n===0;
}
ACT.pmBulkExcluir=()=>{
  const ids=[...PMSEL]; if(!ids.length) return;
  const n=ids.reduce((a,id)=>a+S.eps.filter(e=>e.med===id).length,0);
  abrirModal(()=>({titulo:'Excluir medicamentos selecionados',narrow:true,corpo:`<p style="margin-top:0">Excluir <b>${ids.length}</b> ${plural(ids.length,'medicamento')} do cadastro?${n?` As <b>${n}</b> ${plural(n,'falta registrada','faltas registradas')} deles também serão apagadas.`:''}</p>`,
    rodape:`<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn danger" data-act="pmBulkExcluirOk">Excluir ${ids.length}</button>`}));
};
ACT.pmBulkExcluirOk=()=>{
  const ids=[...PMSEL];
  S.eps=S.eps.filter(e=>!ids.includes(e.med)); S.meds=S.meds.filter(m=>!ids.includes(m.id)); PMSEL.clear();
  logar('Cadastro','',`${ids.length} medicamentos excluídos em lote`); fecharModal(); commit(); toast('Medicamentos excluídos.');
};
function nomeLivre(nome,ignorarId){ const k=norm(nome); const id=IDX.key.get(k); return !id||id===ignorarId; }
ACT.medUnir=b=>{
  const m=S.meds.find(x=>x.id===b.dataset.id), par=parecidosCom(m,5,0.01); let erro='', alvo=(par[0]&&par[0].score>=0.5)?par[0].med.id:'';
  const idsPar=new Set(par.map(p=>p.med.id));
  abrirModal(()=>({titulo:'Unir a outro medicamento',narrow:true,corpo:`<p style="margin-top:0"><b>${esc(m.nome)}</b> será incorporado ao medicamento escolhido: as faltas passam para ele e o nome atual vira nome alternativo.</p>${erro?`<div class="msg err">${erro}</div>`:''}
    <div class="field"><label for="uAlvo">Manter este medicamento</label><select id="uAlvo"><option value="">Selecione…</option>
      ${par.length?`<optgroup label="Mais parecidos">${par.map(p=>`<option value="${p.med.id}" ${alvo===p.med.id?'selected':''}>${Math.round(p.score*100)}% — ${esc(p.med.nome)}</option>`).join('')}</optgroup>`:''}
      <optgroup label="Todos os medicamentos">${[...S.meds].filter(x=>x.id!==m.id&&!idsPar.has(x.id)).sort(cmpNome).map(x=>`<option value="${x.id}" ${alvo===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</optgroup></select></div>
    ${alvo?'<p class="muted small">Já vem selecionado o mais parecido — confira antes de unir.</p>':''}`,
    rodape:`<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" data-act="medUnirOk" data-id="${m.id}">Unir</button>`}));
  PLAN={edit:true,desenha:x=>{ erro=x; alvo=$('#uAlvo').value; desenharModal(true); }};
};
function unirMeds(deId,paraId){   // devolve mensagem de erro ou ''
  const m=S.meds.find(x=>x.id===deId), alvo=S.meds.find(x=>x.id===paraId); if(!m||!alvo) return 'Medicamento não encontrado.';
  const eps=S.eps.filter(e=>e.med===m.id);
  for(const e of eps){ const cf=sobrepoe(paraId,e.ini,e.fim); if(cf) return `Os dois têm falta no mesmo período (${fmtBR(e.ini)} a ${e.fim?fmtBR(e.fim):'em aberto'} e ${fmtBR(cf.ini)} a ${cf.fim?fmtBR(cf.fim):'em aberto'}). Ajuste as datas na Rotina do dia antes de unir.`; }
  eps.forEach(e=>e.med=paraId);
  alvo.alias=[...new Set([...(alvo.alias||[]),m.nome,...(m.alias||[])])].filter(a=>norm(a)!==norm(alvo.nome));
  S.meds.splice(S.meds.indexOf(m),1); PMSEL.delete(m.id); logar('Cadastro',alvo.nome,`unido com “${m.nome}”`); return '';
}
ACT.medUnirOk=b=>{
  const alvoId=$('#uAlvo').value; if(!alvoId) return PLAN.desenha('Escolha o medicamento que será mantido.');
  const err=unirMeds(b.dataset.id,alvoId); if(err) return PLAN.desenha(err);
  fecharModal(); commit(); toast('Medicamentos unidos.');
};
ACT.medUnirDireto=b=>{
  const err=unirMeds(b.dataset.de,b.dataset.para);
  if(err){ fecharModal(); return modalMsg('Não foi possível unir',`<p>${err}</p>`); }
  fecharModal(); commit(); toast('Nome acrescentado em “outros nomes”.');
};
ACT.medExcluir=b=>{
  const m=S.meds.find(x=>x.id===b.dataset.id), n=S.eps.filter(e=>e.med===m.id).length;
  abrirModal(()=>({titulo:'Excluir medicamento',narrow:true,corpo:`<p style="margin-top:0">Excluir <b>${esc(m.nome)}</b> do cadastro?${n?` As <b>${n}</b> ${plural(n,'falta registrada','faltas registradas')} dele também serão apagadas, e os dias saem do histórico e do indicador.`:''}</p>`,
    rodape:`<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn danger" data-act="medExcluirOk" data-id="${m.id}">Excluir</button>`}));
};
ACT.medExcluirOk=b=>{
  const m=S.meds.find(x=>x.id===b.dataset.id); S.eps=S.eps.filter(e=>e.med!==m.id); S.meds.splice(S.meds.indexOf(m),1);
  logar('Cadastro',m.nome,'medicamento excluído'); fecharModal(); commit(); toast('Medicamento excluído.');
};

/* ---------- backup ---------- */
ACT.bkExportar=()=>{
  const h=hoje(), nome=`backup_controle_faltas_${h.replace(/-/g,'')}.json`;
  exportar(nome,'application/json',()=>new Blob([JSON.stringify({app:'controle-faltas',versao:1,exportadoEm:agoraBR(),estado:S})],{type:'application/json'}),'Backup salvo');
};
async function restaurarBackup(file){
  let o; try{ o=JSON.parse(await file.text()); }catch(e){ throw new Error('O arquivo não é um backup válido (JSON ilegível).'); }
  const est=o&&o.estado; if(!o||o.app!=='controle-faltas'||!est||est.v!==1||!Array.isArray(est.meds)||!Array.isArray(est.eps)) throw new Error('Este arquivo não é um backup deste sistema.');
  PLAN={tipo:'backup',est};
  abrirModal(()=>({titulo:'Restaurar backup',narrow:true,corpo:`<p style="margin-top:0">Backup de <b>${esc(o.exportadoEm||'data desconhecida')}</b>: ${est.meds.length} medicamentos, ${est.eps.length} faltas.</p><div class="msg warn">Os dados atuais (${S.meds.length} medicamentos, ${S.eps.length} faltas) serão substituídos. É possível desfazer logo depois em Importações.</div>`,
    rodape:`<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" data-act="bkOk">Restaurar</button>`}));
}
ACT.bkOk=()=>{ const est=PLAN.est; INL=null; guardarAnterior(); S=migrar(est); logar('Backup','','dados restaurados'); fecharModal(); commit(); toast('Backup restaurado.'); };
ACT.bkApagar=()=>{
  abrirModal(()=>({titulo:'Apagar todos os dados',narrow:true,corpo:`<p style="margin-top:0">Isso remove medicamentos, faltas, importações e parâmetros deste navegador. Baixe um backup antes, se precisar dos dados.</p><p class="muted small">Você poderá desfazer logo depois em Importações.</p>`,
    rodape:`<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn ghost" data-act="bkExportar">Baixar backup</button><button class="btn danger" data-act="bkApagarOk">Apagar tudo</button>`}));
};
ACT.bkApagarOk=()=>{ INL=null; guardarAnterior(); S=novoEstado(); fecharModal(); commit(); ativarAba('rotina'); toast('Dados apagados.'); };

/* ---------- início ---------- */
function init(){
  reindex(); renderAll(); ativarAba('rotina'); salvar();
  window.addEventListener('beforeunload',()=>{ try{ salvar(); }catch(e){} });
}
init();
</script></body></html>
