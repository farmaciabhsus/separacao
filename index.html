const COLS = ['Nº Dispensação','Data Dispensação','Usuário','Estabelecimento de Saúde','Nome do Paciente','Nome Social do Paciente','Óbito','Fármaco','Medicamento e Produto (Denominação Genérica)','Lote','Quantidade dispensada'];
const COLKEYS = ['n','data','usuario','estab','paciente','social','obito','farmaco','med','lote','qtd'];

function splitCsvLine(line) {
  if (line.indexOf('"') < 0) return line.split(';');
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && cur.trim() === '') { q = true; cur = ''; }
    else if (ch === ';') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur); return out;
}
const colKey = s => norm(s).replace(/[^A-Z0-9]/g, '');
function decodeBuffer(buf) {
  const u8 = new Uint8Array(buf);
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(u8).replace(/^﻿/, ''), enc: 'UTF-8' }; }
  catch (e) { return { text: new TextDecoder('windows-1252').decode(u8), enc: 'Windows-1252 (padrão SIGAF)' }; }
}

/* Divide uma linha em itens: medicamentos combinados vêm separados por "-",
   lotes e quantidades por espaço (mesma regra da macro Gerar_Listas). */
function splitItems(r) {
  const med = String(r.med || '').replace(/FRASCO-AMPOLA/gi, 'FRASCO/AMPOLA').trim();
  const lotes = String(r.lote || '').trim().split(/\s+/).filter(Boolean);
  const qtdTxt = String(r.qtd || '').trim().split(/\s+/).filter(Boolean);
  const qtds = qtdTxt.map(parseNum);
  const farms = String(r.farmaco || '').split(/\s-\s|\s-$/).map(s => s.trim().replace(/-$/, '').trim()).filter(Boolean);
  const n = qtds.length;
  let meds = null;
  if (n > 1 && farms.length === n) {
    const up = med.toUpperCase(); let from = 0; const pos = [];
    for (const f of farms) { const i = up.indexOf(f.toUpperCase(), from); if (i < 0) { pos.length = 0; break; } pos.push(i); from = i + f.length; }
    if (pos.length === n) meds = pos.map((p, k) => med.slice(p, k + 1 < n ? pos[k + 1] : med.length));
  }
  if (!meds) meds = n <= 1 ? [med] : med.split('-').map(s => s.trim()).filter(Boolean);
  meds = meds.map(m => clean(m.replace(/-\s*$/, '')));
  const ok = meds.length === n && (lotes.length === n || (lotes.length === 0 && n === 1)) && n > 0 && qtds.every(q => !isNaN(q));
  const items = [];
  for (let i = 0; i < Math.max(meds.length, n); i++) items.push({ med: meds[i] || '', farm: (farms.length === n ? farms[i] : String(r.farmaco || '')) || '', lote: lotes[i] || '', qtd: isNaN(qtds[i]) ? 0 : Math.trunc(qtds[i] || 0), qtdRaw: qtds[i] });
  return { items, ok };
}

function analyzeReport(text, fileName, size, enc) {
  const res = { fileName, size, enc, filtros: {}, checks: [], rows: [], footer: {}, header: false, periodo: null };
  const add = (lvl, txt, det) => res.checks.push({ lvl, txt, det: det || [] });
  if (/RELATORIO_CONSOLIDADO_DE_DISPENSACAO_POR_FARMACO/.test(norm(fileName).replace(/ /g, '_'))) add('ok', 'Nome do arquivo no padrão do SIGAF (Relatório Consolidado de Dispensação por Fármaco).');
  else add('warn', 'O nome do arquivo não segue o padrão "relatorio_Relatorio_Consolidado_de_Dispensacao_por_Farmaco…". Confira se é o relatório certo.');
  const lines = text.split(/\r?\n/);
  let hi = -1;
  for (let i = 0; i < Math.min(lines.length, 100); i++) if (/^N.{0,2}DISPENSACAO/.test(norm(lines[i]))) { hi = i; break; }
  if (hi < 0) { add('err', 'Cabeçalho "Nº Dispensação" não encontrado nas 100 primeiras linhas. O arquivo está fora do padrão do relatório.'); return res; }
  for (let i = 0; i < hi; i++) {
    const p = splitCsvLine(lines[i]); const k = clean(p[0]).replace(/:$/, '').trim();
    if (k && p.length > 1 && clean(p[1])) res.filtros[k] = clean(p[1]);
  }
  const hdr = splitCsvLine(lines[hi]).map(clean);
  const idx = {}; const miss = [];
  COLS.forEach((c, j) => { const i = hdr.findIndex(h => colKey(h) === colKey(c)); if (i < 0) miss.push(c); else idx[COLKEYS[j]] = i; });
  if (miss.length) { add('err', `Colunas obrigatórias ausentes: ${miss.join(', ')}.`); return res; }
  res.header = true;
  add('ok', `Estrutura reconhecida: ${COLS.length} colunas do relatório, cabeçalho na linha ${hi + 1}.`);
  const bad = [];
  for (let i = hi + 1; i < lines.length; i++) {
    const L = lines[i]; if (!L.trim()) continue;
    const nl = norm(L);
    if (nl.startsWith('QUANTIDADE MEDICAMENTOS')) { res.footer.linhas = parseNum(splitCsvLine(L)[1]); continue; }
    if (nl.startsWith('QUANTIDADE DISPENSADAS')) { res.footer.unidades = parseNum(splitCsvLine(L)[1]); continue; }
    if (nl.startsWith('QUANTIDADE DE DISPENSACOES')) { res.footer.dispensacoes = parseNum(splitCsvLine(L)[1]); continue; }
    const f = splitCsvLine(L);
    if (f.length < hdr.length - 1) { bad.push(`Linha ${i + 1}: ${clean(L).slice(0, 80)}`); continue; }
    const r = { linha: i + 1 }; COLKEYS.forEach(k => r[k] = String(f[idx[k]] ?? ''));
    ['n', 'data', 'usuario', 'estab', 'paciente', 'social', 'obito'].forEach(k => r[k] = clean(r[k]));
    r.dataISO = brDateToISO(r.data);
    const sp = splitItems(r); r.items = sp.items; r.itemsOk = sp.ok;
    r.medTxt = clean(r.med.replace(/-\s*$/, ''));
    res.rows.push(r);
  }
  if (bad.length) add('warn', `${bad.length} linha(s) com formato inesperado foram ignoradas.`, bad);
  if (!res.rows.length) { add('err', 'Nenhuma dispensação encontrada no arquivo.'); return res; }
  // Rodapé
  const soma = res.rows.reduce((a, r) => a + r.items.reduce((b, it) => b + (isNaN(it.qtdRaw) ? 0 : it.qtdRaw), 0), 0);
  res.somaUnidades = soma;
  if (res.footer.linhas == null) add('err', 'Rodapé "Quantidade Medicamentos" não encontrado: o arquivo pode estar incompleto ou ter sido editado. Exporte novamente do SIGAF.');
  else if (res.footer.linhas === res.rows.length) add('ok', `Total de linhas confere com o rodapé do SIGAF: ${res.rows.length}.`);
  else add('err', `Total de linhas não confere: rodapé informa ${res.footer.linhas}, arquivo tem ${res.rows.length}. Exporte o relatório novamente.`);
  if (res.footer.unidades == null) add('err', 'Rodapé "Quantidade Dispensadas" não encontrado: o arquivo pode estar incompleto ou ter sido editado. Exporte novamente do SIGAF.');
  else if (Math.abs(res.footer.unidades - soma) < 0.001) add('ok', `Total de unidades confere com o rodapé do SIGAF: ${fmtNum(soma)}.`);
  else add('err', `Total de unidades não confere: rodapé informa ${fmtNum(res.footer.unidades)}, a soma das linhas dá ${fmtNum(soma)}.`);
  const inc = res.rows.filter(r => !r.itemsOk);
  if (inc.length) add('err', `${inc.length} linha(s) com medicamento, lote e quantidade que não batem entre si.`, inc.map(r => `Nº ${r.n} – ${r.paciente}: lote "${clean(r.lote)}", qtd "${clean(r.qtd)}"`));
  else add('ok', 'Medicamento, lote e quantidade conferem em todas as linhas (inclusive as com mais de um item).');
  const frac = []; res.rows.forEach(r => r.items.forEach(it => { if (!isNaN(it.qtdRaw) && it.qtdRaw % 1) frac.push(`Nº ${r.n} – ${it.med}: ${it.qtdRaw}`); }));
  if (frac.length) add('warn', 'Quantidades com casas decimais foram arredondadas para baixo, como na planilha.', frac);
  const semLote = res.rows.filter(r => !clean(r.lote));
  if (semLote.length) add('warn', `${semLote.length} linha(s) sem lote.`, semLote.map(r => `Nº ${r.n} – ${r.paciente}`));
  const vaz = res.rows.filter(r => !r.n || !r.paciente || !r.medTxt || !r.items.some(it => it.med));
  if (vaz.length) add('err', `${vaz.length} linha(s) sem nº de dispensação, paciente ou medicamento.`, vaz.map(r => `Linha ${r.linha}: ${r.n || '(sem nº)'} – ${r.paciente || '(sem paciente)'}`));
  const semData = res.rows.filter(r => !r.dataISO);
  if (semData.length) add('warn', `${semData.length} linha(s) com data de dispensação inválida.`, semData.map(r => `Nº ${r.n}: "${r.data}"`));
  const neg = []; res.rows.forEach(r => r.items.forEach(it => { if (it.qtd < 0) neg.push(`Nº ${r.n} – ${r.paciente}: ${it.med} (${it.qtd})`); }));
  if (neg.length) add('warn', `${neg.length} item(ns) com quantidade negativa (possível estorno) serão ignorados.`, neg);
  const zero = []; res.rows.forEach(r => r.items.forEach(it => { if (it.qtd === 0) zero.push(`Nº ${r.n} – ${r.paciente}: ${it.med} (lote ${it.lote || '—'})`); }));
  if (zero.length) add('info', `${zero.length} ${zero.length > 1 ? 'itens vieram' : 'item veio'} com quantidade 0 e não ${zero.length > 1 ? 'entram' : 'entra'} na separação. Não precisa fazer nada.`, zero);
  // Período
  const per = (res.filtros['Data Dispensação'] || '').match(/(\d{2}\/\d{2}\/\d{4}).*?(\d{2}\/\d{2}\/\d{4})/);
  if (per) {
    res.periodo = [brDateToISO(per[1]), brDateToISO(per[2])];
    const fora = res.rows.filter(r => r.dataISO && (r.dataISO < res.periodo[0] || r.dataISO > res.periodo[1]));
    if (fora.length) add('warn', `${fora.length} dispensação(ões) fora do período filtrado.`, fora.map(r => `Nº ${r.n} – ${r.data}`));
    else add('ok', `Todas as datas dentro do período filtrado (${per[1]} a ${per[2]}).`);
  }
  // Nº repetido
  const cn = {}; res.rows.forEach(r => cn[r.n] = (cn[r.n] || 0) + 1);
  const rep = Object.keys(cn).filter(k => cn[k] > 1);
  if (rep.length) add('warn', `${rep.length} número(s) de dispensação aparecem mais de uma vez.`, rep);
  // Duplicidade paciente + medicamento (macro CONFERE_DISPENSACAO_DUPLICADA)
  const dup = duplicados(res.rows);
  if (dup.size) add('warn', `${dup.size} combinação(ões) paciente + medicamento repetidas. Elas ficam em vermelho na lista de pacientes.`, [...dup].map(k => k.replace('|', ' – ')));
  else add('ok', 'Nenhum paciente com o mesmo medicamento dispensado duas vezes.');
  const ob = res.rows.filter(r => norm(r.obito).startsWith('SIM'));
  if (ob.length) add('warn', `${ob.length} dispensação(ões) para paciente marcado com óbito.`, ob.map(r => `Nº ${r.n} – ${r.paciente}`));
  return res;
}

function duplicados(rows) {
  const c = {}, label = {};
  rows.forEach(r => { const k = norm(r.paciente) + '|' + norm(r.medTxt); c[k] = (c[k] || 0) + 1; label[k] = r.paciente + '|' + r.medTxt; });
  return new Set(Object.keys(c).filter(k => c[k] > 1).map(k => label[k]));
}
const dupKey = r => norm(r.paciente) + '|' + norm(r.medTxt);
function dupKeys(rows) { const c = {}; rows.forEach(r => { const k = dupKey(r); c[k] = (c[k] || 0) + 1; }); return new Set(Object.keys(c).filter(k => c[k] > 1)); }

/* Classificação (macro Gerar_Listas, ampliada para todas as insulinas) */
function classify(med, controlados) {
  const n = norm(med);
  if (n.includes('INSULINA')) {
    if (n.includes('ACAO RAPIDA')) {
      if (/CRIAN.A/.test(n)) return { grupo: 'INS', tipo: 'ASPARTE CRIANCA', tl: 'ASPARTE CRIANCA', rapida: true };
      if (/REUTILIZ.VEL/.test(n)) return { grupo: 'INS', tipo: 'ASPARTE S. REUTILIZAVEL', tl: 'ASPARTE REUTILIZAVEL', rapida: true };
      return { grupo: 'INS', tipo: 'ASPARTE S. DESCARTAVEL', tl: 'ASPARTE DESCARTAVEL', rapida: true };
    }
    if (n.includes('PROLONGADA')) {
      const t = n.includes('CANETA') ? 'PROLONGADA CANETA' : /FRASCO/.test(n) ? 'PROLONGADA FRASCO' : 'PROLONGADA';
      return { grupo: 'INS', tipo: t, tl: t, prolongada: true };
    }
    const t = n.replace(/\(.*$/, '').replace(/\d.*$/, '').trim().slice(0, 40);
    return { grupo: 'INS', tipo: t, tl: t };
  }
  for (const c of controlados || []) if (c && n.includes(norm(c))) return { grupo: 'CTL' };
  return { grupo: 'BAS' };
}

function arredondar(L, modo) {
  if (!L) return 0;
  if (modo === 'SIM, CIMA') return L > 100 ? Math.ceil(L / 100) * 100 : 100;
  if (modo === 'SIM, BAIXO') return Math.floor(L / 100) * 100;
  return L;
}

/* Todos os cálculos das abas Insulina, Soma_Insulina, Lista_Normal, Lista_Controlado */
function derive(m, cad, mun) {
  const rows = mun ? m.rows.filter(r => r.municipio === mun) : m.rows;
  const all = []; let linhasRapida = 0, linhasProl = 0;
  for (const r of rows) {
    let prol = false, rap = false;
    for (const it of r.items) {
      if (it.qtd <= 0) continue;
      const c = classify(it.med, cad.controlados);
      if (c.prolongada) prol = true;
      if (c.rapida) rap = true;
      all.push({ ...it, ...c, paciente: r.paciente, n: r.n, municipio: r.municipio, tipoLote: c.grupo === 'INS' ? `${it.lote} - ${c.tl}` : '' });
    }
    if (prol) linhasProl++;
    if (rap) linhasRapida++;
  }
  const ins = all.filter(x => x.grupo === 'INS');
  // resumo único por lote/tipo (filtro avançado G:I + SOMASE em J)
  const insResumo = []; const map = {};
  for (const x of ins) {
    if (!map[x.tipoLote]) { map[x.tipoLote] = { lote: x.lote, tipo: x.tipo, tipoLote: x.tipoLote, med: x.med, farm: x.farm || '', total: 0, pacientes: 0, dist: {} }; insResumo.push(map[x.tipoLote]); }
    const g = map[x.tipoLote]; g.total += x.qtd; g.pacientes++; g.dist[x.qtd] = (g.dist[x.qtd] || 0) + 1;
  }
  const L = (linhasRapida + (m.agulhaProlongada ? linhasProl : 0)) * (m.dias || 0);
  const agulhas = arredondar(L, m.arred);
  // pivôs básicos / controlados
  const piv = g => {
    const o = {}; all.filter(x => x.grupo === g).forEach(x => { const k = clean(x.med) + '\u0001' + x.lote; o[k] = (o[k] || 0) + x.qtd; });
    return Object.keys(o).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(k => { const [med, lote] = k.split('\u0001'); return { med, lote, soma: o[k] }; });
  };
  // quantitativo por medicamento
  const pm = {}; const porMed = [];
  for (const x of all) {
    const key = x.grupo === 'INS' ? 'INS|' + norm(x.med) : norm(x.med);
    if (!pm[key]) { pm[key] = { med: clean(x.med), grupo: x.grupo, lotes: {}, total: 0, pacientes: new Set(), itens: [] }; porMed.push(pm[key]); }
    const g = pm[key]; g.total += x.qtd; g.pacientes.add(norm(x.paciente)); g.itens.push(x);
    g.lotes[x.lote] = g.lotes[x.lote] || { lote: x.lote, soma: 0, pacientes: 0 }; g.lotes[x.lote].soma += x.qtd; g.lotes[x.lote].pacientes++;
  }
  const ordem = { INS: 0, BAS: 1, CTL: 2 };
  porMed.sort((a, b) => ordem[a.grupo] - ordem[b.grupo] || a.med.localeCompare(b.med, 'pt-BR'));
  porMed.forEach(g => { g.lotes = Object.values(g.lotes); g.nPac = g.pacientes.size; });
  return { rows, all, ins, insResumo, linhasRapida, linhasProl, L, agulhas, basicos: piv('BAS'), controlados: piv('CTL'), porMed,
    unidades: all.reduce((a, x) => a + x.qtd, 0), nPac: new Set(rows.map(r => norm(r.paciente))).size };
}

function findLote(cad, lote) { const k = norm(lote); if (!k) return null; return (cad.lotes || []).find(l => norm(l.lote) === k) || null; }
/* ---- conferências do lote físico ---- */
const SIT_LOTE = { liberado: 'Liberado', bloqueado: 'Bloqueado', recolhido: 'Recolhido' };
const sitLote = c => (c && (c.situacao === 'bloqueado' || c.situacao === 'recolhido')) ? c.situacao : 'liberado';
const addDaysISO = (iso, n) => { const d = isoToUTC(iso); if (!d) return ''; d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const STOP_MED = new Set(['DE', 'DA', 'DO', 'DAS', 'DOS', 'COM', 'SEM', 'PARA', 'POR', 'MG', 'ML', 'UI', 'MCG', 'G']);
const INS_ACAO = { ASPARTE: 'RAPIDA', LISPRO: 'RAPIDA', LISSPRO: 'RAPIDA', GLULISINA: 'RAPIDA', GLARGINA: 'PROLONGADA', DETEMIR: 'PROLONGADA', DEGLUDECA: 'PROLONGADA' };
const medTokens = s => norm(s).replace(/[^A-Z0-9 ]/g, ' ').replace(/(\d)([A-Z])/g, '$1 $2').replace(/([A-Z])(\d)/g, '$1 $2').split(' ').filter(Boolean);
/* O medicamento do cadastro do lote "confere" com o do relatório quando todas as suas palavras
   significativas (e todos os números de dosagem) aparecem no medicamento ou no fármaco do relatório.
   Aceita abreviações: CAPS ≈ CAPSULA, COMP ≈ COMPRIMIDO. Sem medicamento no cadastro, não há o que conferir. */
function loteConfere(cadMed, med, farm) {
  const tk = medTokens(cadMed); if (!tk.length) return true;
  const alvo = medTokens(med + ' ' + (farm || ''));
  const nums = tk.filter(t => /^\d+$/.test(t)); if (nums.some(t => !alvo.includes(t))) return false;
  const words = tk.filter(t => !/\d/.test(t) && t.length >= 3 && !STOP_MED.has(t));
  /* O SIGAF descreve as insulinas análogas pela ação, não pelo princípio ativo:
     ASPARTE/LISPRO/GLULISINA aparecem como "AÇÃO RÁPIDA"; GLARGINA/DETEMIR/DEGLUDECA como "AÇÃO PROLONGADA". */
  const temAlvo = w => alvo.some(u => u === w || (w.length >= 4 && u.length >= 4 && (u.startsWith(w) || w.startsWith(u))));
  return words.every(w => temAlvo(w) || (INS_ACAO[w] && temAlvo(INS_ACAO[w])));
}
/* Todos os alertas de um lote numa data de separação, com o nº de dias que o paciente vai usar */
function alertasLote(cad, lote, dataISO, dias, med, farm) {
  const c = findLote(cad, lote), out = []; if (!c) return out;
  const sit = sitLote(c);
  if (sit !== 'liberado') out.push({ lvl: 'err', tipo: sit, txt: `Lote ${SIT_LOTE[sit].toLowerCase()}${c.motivoSituacao ? ': ' + c.motivoSituacao : ''}` });
  if (c.validade && dataISO) {
    if (c.validade < dataISO) out.push({ lvl: 'err', tipo: 'vencido', txt: `Vencido em ${isoToBr(c.validade)}` });
    else if (dias > 0 && c.validade < addDaysISO(dataISO, dias)) out.push({ lvl: 'warn', tipo: 'curta', txt: `Vence em ${isoToBr(c.validade)}, antes de ${dias} dias de uso` });
  }
  if (med && c.medicamento && !loteConfere(c.medicamento, med, farm)) out.push({ lvl: 'warn', tipo: 'outro', txt: `Cadastrado como "${c.medicamento}"` });
  return out;
}

function normalizeCad(c) {
  const d = clone(DEFAULT_CAD); c = c || {};
  return { agulhaLote: c.agulhaLote ?? d.agulhaLote, lotes: Array.isArray(c.lotes) ? clone(c.lotes) : d.lotes, municipios: Array.isArray(c.municipios) ? [...c.municipios] : d.municipios, controlados: Array.isArray(c.controlados) ? [...c.controlados] : d.controlados };
}

};
if (!TABS.some(t => t[0] === S.tab)) S.tab = 'importar';

/* ---------- persistência ---------- */
async function connect() {
  const fim = () => { S.ready = true; render(); };
  if (!window.claude || typeof window.claude.use !== 'function') return fim();
  let db = null; try { db = await window.claude.use('db'); } catch (e) {}
  if (!db) return fim();
  let okCad = false, okHist = false; const chk = () => { if (okCad && okHist && !S.ready) fim(); };
  setTimeout(() => { if (!S.ready) { S.readyTimeout = true; fim(); } }, 15000);
  S.db = db; S.mode = 'db';
  try {
    db.doc('cadastros/geral').onSnapshot(s => { if (s.exists) { S.cad = normalizeCad(s.data()); LS.set('sigaf_cad', S.cad); } if (!s.metadata.fromCache) { okCad = true; chk(); } render(); }, () => { okCad = true; chk(); });
    db.collection('atividades').orderBy('ts', 'desc').limit(300).onSnapshot(s => { S.log = s.docs.map(d => ({ id: d.id, ...clone(d.data()) })); if (S.tab === 'historico') render(); }, () => {});
    db.collection('separacoes').orderBy('salvoEm', 'desc').limit(1000).onSnapshot(s => { S.hist = s.docs.map(d => ({ id: d.id, ...clone(d.data()) })); if (!s.metadata.fromCache) { okHist = true; chk(); } render(); }, () => { S.histErro = true; okHist = true; chk(); });
  } catch (e) { fim(); }
  render();
}
/* Situação do salvamento — mostrada sempre no topo (chip) */
function marcaSalvo(ok, msg) {
  S.save = ok ? { kind: 'ok', at: new Date(), msg: '' } : { kind: 'err', at: new Date(), msg: msg || 'Não foi possível salvar.' };
  const c = $('#saveChip'); if (c) c.outerHTML = saveChip();
}
function saveChip() {
  const hm = d => d ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  if (S.save.kind === 'err') return `<span class="chip bad" id="saveChip" data-tab="backup" title="${esc(S.save.msg)}">⚠ Falha ao salvar · baixe um backup</span>`;
  if (!S.ready) return `<span class="chip" id="saveChip">Carregando dados…</span>`;
  if (S.mode === 'db') return `<span class="chip ok" id="saveChip" title="Cadastros e histórico ficam no sistema, compartilhados com quem tem acesso. A separação ativa fica neste navegador.">✓ Salvo no sistema${S.save.at ? ' às ' + hm(S.save.at) : ''}</span>`;
  return `<span class="chip warn" id="saveChip" data-tab="backup" title="Os dados existem só neste navegador. Limpar o navegador apaga tudo, inclusive o histórico de separados.">Só neste navegador${S.save.at ? ' · ' + hm(S.save.at) : ''} · faça backup</span>`;
}

/* Gravação de cadastros e histórico (sem toast nem render: quem chama decide) */
async function persistCad() {
  const okLocal = LS.set('sigaf_cad', S.cad);
  if (S.db) {
    try { await S.db.doc('cadastros/geral').set(clone(S.cad)); marcaSalvo(true); return true; }
    catch (e) { marcaSalvo(false, 'Cadastros não foram gravados no sistema: ' + (e.message || e.code)); return false; }
  }
  marcaSalvo(okLocal, 'O navegador não permitiu salvar os cadastros (armazenamento cheio ou bloqueado).'); return okLocal;
}
async function histWrite(sets, dels) {
  sets = sets || []; dels = dels || [];

function pacRows(rows, dk) {
  const q = norm(S.q); const multi = new Set(S.cur.rows.map(r => r.municipio)).size > 1;
  const f = q ? rows.filter(r => norm([r.n, r.paciente, r.medTxt, r.lote, r.usuario].join(' ')).includes(q)) : rows;
  if (!f.length) return `<tr><td colspan="8" class="muted">Nenhuma linha encontrada.</td></tr>`;
  return f.map(r => `<tr class="${dk.has(dupKey(r)) ? 'dup' : ''}"><td class="mono">${esc(r.n)}</td><td>${esc(r.data)}</td><td>${esc(r.usuario)}</td><td class="dp">${esc(r.paciente)}${norm(r.obito).startsWith('SIM') ? ' <span class="pill p-bad">ÓBITO</span>' : ''}</td><td class="dp wrapc">${esc(r.medTxt)}</td><td class="mono">${esc(clean(r.lote))}</td><td class="num">${r.items.map(i => i.qtd).join(' ')}</td>${multi ? `<td>${esc(r.municipio)}</td>` : ''}</tr>`).join('');
}

      <div class="sep"><span class="lbl">Separar</span><span class="big">${fmtNum(g.total)}</span><span>tubete(s)</span></div></div>`; }).join('')}

function vRecibos() {

  { const s = situacaoConferencia(); h += s.st === 'ok' ? '' : boxConferencia(); }
  const missing = rec.itens.filter(i => i.falta);
  const ex = estadoExportRecibo(rec);
  const venc = rec.itens.filter(i => i.vencido), curta = rec.itens.filter(i => i.curta), bloq = rec.itens.filter(i => i.bloqueado);
  h += `<div class="rlayout"><div class="rlist">${recs.map(r => `<button class="ritem" data-rec="${esc(r.key)}" aria-current="${r.key === S.recSel}"><span>${esc(r.nome)}</span><small>${muns > 1 ? esc(r.mun) + ' · ' : ''}${r.itens.length} item(ns) · ${brl2(r.totalGeral)}${r.falta ? ' · <b style="color:var(--warn)">falta cadastro</b>' : ''}${r.vencido ? ' · <b style="color:var(--bad)">lote vencido</b>' : ''}${r.bloqueado ? ' · <b style="color:var(--bad)">lote bloqueado/recolhido</b>' : ''}${r.curta ? ' · <b style="color:var(--warn)">validade curta</b>' : ''}${(() => { const e = estadoExportRecibo(r); return e ? (e.mudou ? ' · <b style="color:var(--bad)">alterado após exportar</b>' : ' · <span style="color:var(--ok)">exportado</span>') : ''; })()}</small></button>`).join('')}</div>

    ${[...new Map(missing.map(i => [i.lote, i])).values()].map(i => { const c = findLote(S.cad, i.lote) || {}; return `<div class="row"><div><span class="lbl">Lote</span><div class="mono">${esc(i.lote || '(sem lote)')}</div><div class="small muted">${esc(i.desc)}</div></div><label class="f"><span class="lbl">Validade</span><input type="date" data-mv="${esc(i.lote)}" value="${esc(c.validade || '')}"></label><label class="f"><span class="lbl">Valor unitário</span><input type="number" step="0.0001" min="0" data-mp="${esc(i.lote)}" value="${c.valor ?? ''}"></label></div>`; }).join('')}
    <div style="margin-top:10px"><button class="primary" data-act="saveMissing">Salvar no cadastro</button></div></div>` : ''}
    <div class="paperwrap">${paper(rec)}</div></div></div>`;
  return h;

function vRegistro() {

    <label class="f" style="min-width:180px"><span class="lbl">Tipo</span><select id="logFiltro"><option value="">Todos</option>${tipos.map(t => `<option ${S.logFiltro === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label></div>

function vBackup() {
  const ult = LS.get('sigaf_ultimo_backup', null);
  const diasBk = ult ? Math.floor((Date.now() - new Date(ult)) / 864e5) : null;
  const modo = S.mode === 'db'
    ? 'Cadastros e histórico ficam salvos no sistema, compartilhados com quem tem acesso a ele. A separação ativa fica só neste navegador. O backup protege contra exclusões e alterações por engano.'
    : '<b>Os dados existem só neste navegador.</b> Limpar os dados do navegador, trocar de computador ou usar janela anônima apaga cadastros e histórico de separados. Baixe um backup com frequência.';
  let h = head('Backup e dados', modo);
  if (S.save.kind === 'err') h += `<div class="verdict err" style="margin-bottom:14px"><span class="ic err">✕</span><span>${esc(S.save.msg)} Baixe um backup agora para não perder as alterações.</span></div>`;
  h += `<div class="stack">`;
  if (S.undo) h += boxDesfazer();
  h += `<div class="grid2">
    <div class="card"><h3 style="margin-bottom:6px">Baixar backup</h3>
      <p class="small muted" style="margin:0 0 10px">Um arquivo .json com cadastros (lotes, municípios, controlados, lote das agulhas) e o histórico de separados. ${ult ? `Último backup baixado neste navegador: <b>${quandoBR(ult)}</b>${diasBk >= 7 ? ` <span style="color:var(--warn)">(há ${diasBk} dias)</span>` : ''}.` : 'Nenhum backup baixado ainda neste navegador.'}</p>
      <dl class="kv" style="margin-bottom:12px"><dt>Lotes</dt><dd>${S.cad.lotes.length}</dd><dt>Municípios</dt><dd>${S.cad.municipios.length}</dd><dt>Controlados</dt><dd>${S.cad.controlados.length}</dd><dt>Separações no histórico</dt><dd>${S.hist.length}${S.hist.length >= 1000 ? ' (as 1.000 mais recentes)' : ''}</dd></dl>
      ${S.cur ? `<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="bkCur" ${S.bkCur ? 'checked' : ''}> <span>Incluir a separação ativa (${esc(S.cur.nome)}, ${S.cur.rows.length} dispensações). <b>Contém nomes de pacientes</b> — guarde o arquivo em local protegido.</span></label>` : ''}
      <button class="primary" data-act="expBk" ${S.ready ? '' : 'disabled'}>Baixar backup (.json)</button></div>
    <div class="card"><h3 style="margin-bottom:6px">Restaurar backup</h3>
      <p class="small muted" style="margin:0 0 10px">O arquivo é conferido antes de qualquer alteração. Depois de restaurar, é possível desfazer.</p>
      <div class="drop sm" id="dropBk"><span class="muted small">Arraste o .json aqui ou</span><button data-act="pickBk">Selecionar backup</button></div></div>
  </div>`;
  const R = S.restore;
  if (R) {
    const o = R.obj || {};
    h += `<div class="card"><div class="head" style="margin-bottom:10px"><h3>Conferência do backup</h3><span class="chip mono">${esc(R.fileName)}</span></div>`;
    if (R.erros.length) h += `<div class="verdict err"><span class="ic err">✕</span><span>Restauração bloqueada: ${R.erros.map(esc).join(' ')}</span></div><div class="tools" style="margin-top:12px"><button data-act="rsCancel">Fechar</button></div></div>`;
    else {
      const idsAtual = new Set(S.hist.map(x => x.id));
      const novos = R.histOk.filter(x => !idsAtual.has(x.id)).length, exist = R.histOk.length - novos;
      const sai = S.hist.filter(x => !R.histOk.some(y => y.id === x.id)).length;
      const op = R.opt;
      h += `<dl class="kv" style="margin-bottom:12px"><dt>Gerado em</dt><dd>${quandoBR(o.exportadoEm)} · ${o.origem === 'sistema' ? 'a partir do sistema' : 'a partir de um navegador'}</dd>
        <dt>Cadastros</dt><dd>${o.cadastros.lotes.length} lotes · ${o.cadastros.municipios.length} municípios · ${o.cadastros.controlados.length} controlados</dd>
        <dt>Histórico</dt><dd>${R.histOk.length} separações (${novos} novas, ${exist} já existentes)</dd>
        ${o.separacaoAtiva ? `<dt>Separação ativa</dt><dd>${esc(o.separacaoAtiva.nome)}, ${isoToBr(o.separacaoAtiva.data)} · ${o.separacaoAtiva.rows.length} dispensações</dd>` : ''}</dl>
      ${R.avisos.length ? `<ul class="checks" style="margin-bottom:10px">${R.avisos.map(x => `<li><span class="ic warn">!</span><div>${esc(x)}</div></li>`).join('')}</ul>` : ''}
      <div class="stack" style="gap:8px">
        <label class="chk"><input type="checkbox" data-rs="cad" ${op.cad ? 'checked' : ''}> Substituir os cadastros atuais pelos do backup</label>
        <label class="f" style="max-width:520px"><span class="lbl">Histórico de separados</span><select data-rs="hist">
          <option value="mesclar" ${op.hist === 'mesclar' ? 'selected' : ''}>Mesclar: acrescentar as ${novos} novas e atualizar as ${exist} existentes</option>
          <option value="substituir" ${op.hist === 'substituir' ? 'selected' : ''}>Substituir: o histórico fica igual ao do backup${sai ? ` (remove ${sai})` : ''}</option>
          <option value="nao" ${op.hist === 'nao' ? 'selected' : ''}>Não alterar o histórico</option></select></label>
        ${o.separacaoAtiva ? `<label class="chk"><input type="checkbox" data-rs="cur" ${op.cur ? 'checked' : ''}> Restaurar a separação ativa do backup${S.cur ? ` (substitui ${esc(S.cur.nome)})` : ''}</label>` : ''}
        ${S.mode === 'db' && (op.cad || op.hist !== 'nao') ? '<span class="small" style="color:var(--warn)">Os dados do sistema são compartilhados: a restauração vale para todos que usam este sistema.</span>' : ''}
      </div>
      <div class="tools" style="margin-top:14px">${S.rsArm === 'restore' ? `<button class="danger" data-act="rsOk">Confirmar restauração</button>` : `<button class="primary" data-act="rsArm" ${(!op.cad && op.hist === 'nao' && !op.cur) || !S.ready ? 'disabled' : ''}>Restaurar</button>`}<button data-act="rsCancel">Cancelar</button></div></div>`;
    }
  }
  h += `<div class="card"><h3 style="margin-bottom:6px">Restaurar cadastros padrão</h3>
    <p class="small muted" style="margin:0 0 10px">Volta lotes, municípios, controlados e lote das agulhas para a lista original do sistema. Não altera o histórico nem a separação ativa. Pode ser desfeito logo depois.</p>
    ${S.rsArm === 'padrao' ? `<button class="danger" data-act="padraoOk">Confirmar: restaurar cadastros padrão</button> <button data-act="rsDisarm">Cancelar</button>` : `<button class="danger" data-act="padrao">Restaurar cadastros padrão</button>`}</div>`;
  return h + `</div>`;
}

  cad() { const wb = newWb(); exportCadastro(wb, S.cad); saveXlsx(wb, 'Cadastros SIGAF.xlsx').then(ok => ok && logar('Exportação', 'Cadastros (.xlsx)')); },
  all() { const wb = newWb(); const d = derive(S.cur, S.cad); exportResumo(wb, S.cur, d); exportPacientes(wb, S.cur); exportInsulina(wb, S.cur, d); exportQuantitativo(wb, S.cur, d); exportSeparacao(wb, S.cur, d); const recsT = buildRecibos(S.cur, S.cad); const imp = recsT.filter(r => r.bloqueado); const recs = recsT.filter(r => !r.bloqueado); const multi = new Set(recsT.map(r => r.mun)).size > 1; recs.forEach(r => exportRecibo(wb, r, S.cur, LOGO_B64, 'Recibo ' + (multi ? r.mun + ' ' : '') + r.nome)); exportCadastro(wb, S.cad); saveXlsx(wb, `${fileBase()} - Completo.xlsx`).then(ok => { if (!ok) return; marcarRecibosExportados(recs); logar('Exportação', `Arquivo completo · ${S.cur.nome} · ${recs.length} recibo(s) · total ${brl2(recs.reduce((a, r) => a + r.totalGeral, 0))} · ${S.cur.conf ? 'conferida' : 'não conferida'}`); render(); }); if (imp.length) setTimeout(() => toast(`${imp.length} recibo(s) ficaram fora do arquivo por lote bloqueado/recolhido: ${imp.map(r => r.nome).join(', ')}.`, 'bad'), 4500); },

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-rec]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.delArm = null; S.novaArm = false; if (t.dataset.gotoRec) S.recSel = t.dataset.gotoRec; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.rec) { S.recSel = t.dataset.rec; render(); return; }
  const a = t.dataset.act;
  if (a === 'pick') { $('#file').value = ''; $('#file').click(); }
  else if (a === 'cancel') { S.pend = null; render(); }
  else if (a === 'confirm') confirmImport();
  else if (a === 'clearCur') { if (t.dataset.armed) encerrarSeparacao(); else { t.dataset.armed = '1'; t.textContent = '👉 Aperte de novo para encerrar'; } }
  else if (a === 'exportAll') exp.all();
  else if (a === 'expBk') exportarBackup();
  else if (a === 'pickBk') { $('#fileBk').value = ''; $('#fileBk').click(); }
  else if (a === 'rsArm') { S.rsArm = 'restore'; render(); }
  else if (a === 'rsOk') aplicarRestauracao();
  else if (a === 'rsCancel') { S.restore = null; S.rsArm = null; render(); }
  else if (a === 'padrao') { S.rsArm = 'padrao'; render(); }
  else if (a === 'padraoOk') restaurarPadrao();
  else if (a === 'rsDisarm') { S.rsArm = null; render(); }
  else if (a === 'undo') { S.rsArm = 'undo'; render(); }
  else if (a === 'undoOk') desfazer();
  else if (a === 'expPac') exp.pac();
  else if (a === 'expQuant') exp.quant();
  else if (a === 'expSep') exp.sep();
  else if (a === 'expRec') exp.rec(false);
  else if (a === 'expRecAll') exp.rec(true);
  else if (a === 'expCad') exp.cad();
  else if (a === 'addLote') { S.draft = S.draft || clone(S.cad.lotes); S.draft.unshift({ lote: '', medicamento: '', descricao: '', validade: '', valor: '', situacao: 'liberado', motivoSituacao: '' }); render(); }
  else if (a === 'rmLote') { S.draft = S.draft || clone(S.cad.lotes); S.draft.splice(+t.dataset.i, 1); render(); }
  else if (a === 'saveLotes') {
    const L = (S.draft || []).map(l => ({ ...l, lote: clean(l.lote).toUpperCase(), valor: l.valor === '' || l.valor == null ? '' : +l.valor })).filter(l => l.lote);
    const seen = new Set(); const dup = L.filter(l => { const k = norm(l.lote); if (seen.has(k)) return true; seen.add(k); return false; });
    if (dup.length) { toast('Lote repetido: ' + dup.map(l => l.lote).join(', '), 'bad'); return; }
    logar('Cadastros', 'Lotes salvos — ' + resumoLotes(S.cad.lotes, L));
    S.cad.lotes = L; S.draft = null; saveCad('Lotes salvos');
  }
  else if (a === 'saveMun') { const n = $('#tMun').value.split('\n').map(clean).filter(Boolean); const ad = n.filter(x => !S.cad.municipios.includes(x)), rm = S.cad.municipios.filter(x => !n.includes(x)); logar('Cadastros', `Municípios salvos${ad.length ? ' · incluídos: ' + ad.join(', ') : ''}${rm.length ? ' · removidos: ' + rm.join(', ') : ''}`); S.cad.municipios = n; saveCad('Municípios salvos'); }
  else if (a === 'saveCtl') { const n = $('#tCtl').value.split('\n').map(clean).filter(Boolean); const ad = n.filter(x => !S.cad.controlados.includes(x)), rm = S.cad.controlados.filter(x => !n.includes(x)); logar('Cadastros', `Controlados salvos${ad.length ? ' · incluídos: ' + ad.join(', ') : ''}${rm.length ? ' · removidos: ' + rm.join(', ') : ''}`); S.cad.controlados = n; saveCad('Controlados salvos'); }
  else if (a === 'saveMissing') {
    const antes = clone(S.cad.lotes);
    document.querySelectorAll('[data-mv]').forEach(inp => {
      const lote = inp.dataset.mv; const p = document.querySelector(`[data-mp="${CSS.escape(lote)}"]`);
      let c = findLote(S.cad, lote); if (!c) { c = { lote, medicamento: '', descricao: '', validade: '', valor: '' }; S.cad.lotes.unshift(c); }
      if (inp.value) c.validade = inp.value; if (p && p.value !== '') c.valor = +p.value;
      if (!c.medicamento) { const rec = buildRecibos(S.cur, S.cad).flatMap(r => r.itens).find(i => i.lote === lote); c.medicamento = rec ? rec.desc : ''; }
    });
    logar('Cadastros', 'Dados de lote preenchidos pelo recibo — ' + resumoLotes(antes, S.cad.lotes));
    S.draft = null; saveCad('Dados do lote salvos');
  }
  else if (a === 'armDel') { S.delArm = t.dataset.id; render(); }
  else if (a === 'delH') { S.delArm = null; const h = S.hist.find(x => x.id === t.dataset.id); if (h) logar('Histórico', `Excluída do histórico: ${h.nome} (${isoToBr(h.data)}), ${(h.dispensacoes || []).length} dispensações`); delHist(t.dataset.id); }
  else if (a === 'conferir') conferir();
  else if (a === 'focusNome') { const i = $('#usuario'); if (i) { i.focus(); i.scrollIntoView({ block: 'center' }); } }
  else if (a === 'focusMun') { const i = $('#fNome'); if (i) { i.focus(); i.scrollIntoView({ block: 'center' }); } }
  else if (a === 'separei') { S.cur.sep = { por: quem(), em: new Date().toISOString() }; saveCur(); logar('Separação', `${S.cur.nome}: separação física concluída`); toast('Ótimo! Agora confira tudo de novo.'); render(); window.scrollTo(0, 0); }
  else if (a === 'novaSep') { S.novaArm = true; render(); }
  else if (a === 'novaSepOk') encerrarSeparacao();
  else if (a === 'reabrir') { S.confArm = true; render(); }
  else if (a === 'reabrirOk') reabrirConferencia();
});
document.addEventListener('input', e => {

  else if (t.id === 'usuario') { S.usuario = t.value; LS.set('sigaf_usuario', S.usuario); t.classList.toggle('vazio', !clean(t.value)); document.querySelectorAll('[data-act="conferir"]').forEach(b => b.disabled = !clean(t.value)); atualizaGuia(); }
  else if (t.id === 'q') { S.q = t.value; $('#pacBody').innerHTML = pacRows(curRows(), dupKeys(S.cur.rows)); }
  else if (t.dataset.l != null) { S.draft = S.draft || clone(S.cad.lotes); S.draft[+t.dataset.l][t.dataset.k] = t.value; const b = document.querySelector('[data-act="saveLotes"]'); if (b) b.disabled = false; }
  else if (t.dataset.map != null) { S.form.map[S.form.estabs[+t.dataset.map]] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file') handleFile(t.files[0]);
  else if (t.id === 'fileBk') lerBackup(t.files[0]);
  else if (t.id === 'bkCur') S.bkCur = t.checked;
  else if (t.dataset.rs && S.restore) { const k = t.dataset.rs; S.restore.opt[k] = t.type === 'checkbox' ? t.checked : t.value; S.rsArm = null; render(); }
  else if (t.id === 'fNome' || t.id === 'fData') { S.form[t.id === 'fNome' ? 'nome' : 'data'] = t.value; render(); }
  else if (t.id === 'fExc') S.form.excluir = t.checked;
  else if (t.id === 'fReg') { S.form.registrar = t.checked; render(); }
  else if (t.id === 'munSel') { S.mun = t.value; render(); }
  else if (t.id === 'sDias') { const v = Math.max(0, parseInt(t.value || '0', 10)); if (v !== S.cur.dias) logar('Separação', `${S.cur.nome}: Nº dias ${S.cur.dias} → ${v}`); S.cur.dias = v; saveCur(); render(); }
  else if (t.id === 'sArr') { logar('Separação', `${S.cur.nome}: arredondar agulhas ${S.cur.arred} → ${t.value}`); S.cur.arred = t.value; saveCur(); render(); }
  else if (t.id === 'sProl') { logar('Separação', `${S.cur.nome}: agulhas para insulina prolongada ${t.checked ? 'incluídas' : 'excluídas'}`); S.cur.agulhaProlongada = t.checked; saveCur(); render(); }
  else if (t.id === 'logFiltro') { S.logFiltro = t.value; render(); }
  else if (t.id === 'agLote') { logar('Cadastros', `Lote das agulhas: ${S.cad.agulhaLote || '—'} → ${t.value}`); S.cad.agulhaLote = t.value; saveCad('Lote das agulhas salvo'); }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest('#drop,#dropBk'); if (!d) return; e.preventDefault();
  d.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop') { const f = e.dataTransfer.files[0]; if (d.id === 'dropBk') lerBackup(f); else handleFile(f); }
}));

render();
connect();
</script>

</body></html>
